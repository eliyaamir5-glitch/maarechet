<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>המערכת לבתי ספר · הרשמת מנהל (הדגמה)</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* "המערכת לבתי ספר", גרסת הדגמה של מסלול ההרשמה למנהל. דף נפרד: לא נוגע באפליקציה של הישיבה, לא שולח כלום לשום שרת.
   הטיוטה נשמרת רק בדפדפן (localStorage "pfDraft"). שפה עיצובית: דיו + נייר חם + צהוב "עכשיו" אחד, אייקונים בקו, תנועה עדינה. */
:root{--bg:#f5f3ee;--paper:#fbfaf7;--card:#fff;--ink:#121318;--ink2:#2a2c34;--muted:#6c6f7a;--line:#e5e1d8;--line2:#d6d1c4;--acc:#ffcf33;--acc-ink:#1a1400;--sel:#121318;--good:#137a52;--bad:#b42318;
 --r:14px;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--sh:0 1px 2px rgba(18,19,24,.04),0 8px 24px -12px rgba(18,19,24,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#0e0f12;--paper:#121317;--card:#17181d;--ink:#f1efe9;--ink2:#d5d2ca;--muted:#8d909b;--line:#26272e;--line2:#34353d;--sel:#f1efe9;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.i{width:22px;height:22px;flex:0 0 auto;display:block}
::selection{background:var(--acc);color:var(--acc-ink)}
/* ===== מבנה: במחשב, פס שלבים בצד, בטלפון, פס עליון ===== */
.shell{min-height:100vh;display:grid;grid-template-columns:300px 1fr}
@media (max-width:900px){.shell{grid-template-columns:1fr}}
.rail{position:sticky;top:0;height:100vh;padding:28px 26px;border-inline-end:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:26px}
@media (max-width:900px){.rail{display:none}}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.2px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;position:relative;overflow:hidden}
.mark svg{width:20px;height:20px}.mark::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--acc)}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:-2px}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps::before{content:"";position:absolute;top:10px;bottom:10px;inset-inline-start:10px;width:2px;background:var(--line)}
.steps .fill{position:absolute;top:10px;inset-inline-start:10px;width:2px;background:var(--ink);height:0;transition:height .6s var(--ease)}
.steps li{position:relative;display:flex;align-items:center;gap:12px;padding:7px 0;font-size:14.5px;color:var(--muted);transition:color .3s}
.steps li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);background:var(--paper);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;z-index:1;transition:all .35s var(--ease)}
.steps li.done{color:var(--ink2)}.steps li.done i{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.steps li.cur{color:var(--ink);font-weight:600}.steps li.cur i{border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 70%,transparent)}
.rail .foot{margin-top:auto;font-size:12.5px;color:var(--muted);line-height:1.5}
.rail .foot b{color:var(--ink2);font-weight:600}
.mtop{display:none;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
@media (max-width:900px){.mtop{display:block}}
.mtop-in{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.mtop .cnt{margin-inline-start:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:3px;background:var(--line)}.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .6s var(--ease)}
.badge{font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--line2);border-radius:99px;padding:2px 9px;white-space:nowrap}
/* ===== תוכן ===== */
.stage{position:relative;min-width:0}
main{max-width:720px;margin:0 auto;padding:40px 24px 140px}
@media (max-width:900px){main{padding:24px 16px 130px}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.3px;color:var(--muted);text-transform:uppercase}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--acc)}
h1{font-size:clamp(26px,4.2vw,36px);line-height:1.15;letter-spacing:-.6px;font-weight:700;margin:10px 0 8px}
h2{font-size:15px;font-weight:600;margin:28px 0 10px;color:var(--ink2)}
.lead{color:var(--muted);margin:0 0 22px;font-size:16.5px;max-width:56ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px;color:var(--ink2)}
.hint{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=url],select,textarea{width:100%;border:1px solid var(--line2);background:var(--paper);border-radius:10px;padding:12px 13px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 55%,transparent);background:var(--card)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media (max-width:560px){.grid2{grid-template-columns:1fr}}
/* ===== בחירות ===== */
.opts{display:grid;gap:10px}.opts.two{grid-template-columns:1fr 1fr}@media (max-width:560px){.opts.two{grid-template-columns:1fr}}
.opt{position:relative;display:flex;gap:13px;align-items:flex-start;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;width:100%;transition:border-color .2s,background .2s,transform .25s var(--spring),box-shadow .2s}
.opt:hover{border-color:var(--line2);box-shadow:var(--sh);transform:translateY(-1px)}.opt:active{transform:scale(.985)}
.opt .ic{width:38px;height:38px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--ink2);flex:0 0 auto;transition:background .25s,color .25s}
.opt b{display:block;font-size:15px;font-weight:600;line-height:1.3}.opt span.d{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.opt .ck{margin-inline-start:auto;flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;transition:all .25s var(--spring)}
.opt.radio .ck{border-radius:50%}
.opt .ck svg{width:13px;height:13px;stroke:var(--bg);stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .35s .05s var(--ease)}
.opt[aria-checked=true]{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
.opt[aria-checked=true] .ic{background:var(--acc);color:var(--acc-ink)}
.opt[aria-checked=true] .ck{background:var(--sel);border-color:var(--sel);transform:scale(1.08)}
.opt[aria-checked=true] .ck svg{stroke-dashoffset:0}
.opt .tag{position:absolute;top:-9px;inset-inline-end:14px;background:var(--ink);color:var(--bg);font-size:10.5px;font-weight:600;letter-spacing:.3px;padding:2px 8px;border-radius:99px}
.opt.pop{animation:pop .4s var(--spring)}@keyframes pop{40%{transform:scale(1.02)}}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;transition:all .25s var(--spring);min-width:58px}
.chip:hover{transform:translateY(-1px)}.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:scale(1.04)}
.note{display:flex;gap:10px;align-items:flex-start;border-inline-start:2px solid var(--acc);padding:4px 12px;font-size:13.5px;color:var(--muted);margin:14px 0 0}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--card)}.stepper button{border:0;background:transparent;width:38px;height:38px;font-size:18px;cursor:pointer;transition:background .15s}.stepper button:hover{background:var(--bg)}.stepper output{min-width:36px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.gr{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px;background:var(--card)}
.gr h3{margin:0 0 10px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}.gr h3 small{color:var(--muted);font-weight:400;font-size:12.5px}
.mini{font-size:13px;color:var(--muted)}
/* ===== פס כפתורים ===== */
.bar{position:fixed;inset:auto 0 0 0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
@media (min-width:901px){.bar{inset-inline-start:300px}}
.bar-in{max-width:720px;margin:0 auto;padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
@media (max-width:900px){.bar-in{padding-inline:16px}}
.btn{position:relative;overflow:hidden;border:0;border-radius:11px;padding:13px 22px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;gap:10px;transition:transform .2s var(--spring),opacity .2s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}.btn .i{width:18px;height:18px;transition:transform .3s var(--ease)}.btn:hover .i{transform:translateX(-4px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}.btn.ghost:hover .i{transform:translateX(4px)}
.btn .rip{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rip .6s var(--ease) forwards;pointer-events:none}@keyframes rip{to{transform:scale(4);opacity:0}}
.bar .msg{font-size:13px;color:var(--muted);flex:1;min-width:0}
.err{color:var(--bad);font-weight:600}.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-5px)}75%{transform:translateX(3px)}}
/* ===== מעברים בין דפים ===== */
.view{will-change:transform,opacity}
.view.in-f{animation:inF .55s var(--ease) both}.view.in-b{animation:inB .55s var(--ease) both}
.view.out-f{animation:outF .22s ease-in both}.view.out-b{animation:outB .22s ease-in both}
@keyframes inF{from{opacity:0;transform:translateX(-36px)}}@keyframes inB{from{opacity:0;transform:translateX(36px)}}
@keyframes outF{to{opacity:0;transform:translateX(24px)}}@keyframes outB{to{opacity:0;transform:translateX(-24px)}}
.view [data-s]{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
/* ===== היכרות ===== */
.intro{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;min-height:calc(100vh - 220px)}@media (max-width:760px){.intro{grid-template-columns:1fr;gap:24px;min-height:0}}
.intro h1{font-size:clamp(30px,5vw,46px);letter-spacing:-1px}.intro p{color:var(--muted);font-size:17px;max-width:46ch}
.dots{display:flex;gap:6px;margin-top:22px}.dots i{width:7px;height:7px;border-radius:99px;background:var(--line2);transition:all .45s var(--ease)}.dots i.on{width:28px;background:var(--ink)}
.phone{width:min(280px,74vw);margin:0 auto;aspect-ratio:9/18.5;border-radius:38px;background:#0c0d10;padding:9px;box-shadow:0 40px 80px -30px rgba(18,19,24,.45),0 0 0 1px rgba(255,255,255,.06) inset;position:relative;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.phone::before{content:"";position:absolute;top:16px;left:50%;width:70px;height:20px;margin-left:-35px;border-radius:99px;background:#0c0d10;z-index:2}
.scr{width:100%;height:100%;border-radius:30px;background:#f5f3ee;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:40px 11px 12px;color:#121318;font-size:11px;position:relative}
.scr>*{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 110ms + 200ms)}
.scr .hd{font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}.scr .hd small{font-weight:400;color:#6c6f7a}
.scr .now{background:#ffcf33;border-radius:14px;padding:11px;font-weight:700;color:#1a1400;position:relative;overflow:hidden}.scr .now small{display:block;font-weight:500;opacity:.7;margin-top:2px}
.scr .now .bar2{height:4px;border-radius:9px;background:rgba(0,0,0,.12);margin-top:8px;overflow:hidden}.scr .now .bar2 i{display:block;height:100%;width:30%;background:#1a1400;border-radius:9px;animation:grow 4s var(--ease) infinite alternate}
@keyframes grow{to{width:78%}}
.scr .ln{background:#fff;border-radius:10px;padding:9px;border:1px solid #e5e1d8;display:flex;justify-content:space-between;align-items:center}
.scr .ln s{color:#b42318;text-decoration:none;font-weight:600}
.scr .ex{background:#121318;color:#fff;border-radius:12px;padding:10px;font-weight:600;display:flex;justify-content:space-between}.scr .ex b{color:#ffcf33}
.scr .tch{background:#fff;border-radius:12px;padding:10px;border:1px solid #e5e1d8}.scr .tch b{display:block;margin-bottom:2px}
.scr .tch.hl{border-color:#121318;box-shadow:inset 0 0 0 1px #121318}
.scr .kpi{display:grid;grid-template-columns:1fr 1fr;gap:7px}.scr .kpi div{background:#fff;border-radius:10px;padding:9px;border:1px solid #e5e1d8}.scr .kpi b{font-size:18px;display:block;letter-spacing:-.5px}
.scr .lock{background:#fff;border-radius:12px;padding:11px;border:1px solid #e5e1d8;display:flex;gap:9px;align-items:center}.scr .lock .i{width:16px;height:16px}
.scr .toast{position:absolute;left:11px;right:11px;bottom:14px;background:#121318;color:#fff;border-radius:12px;padding:10px;font-weight:600;animation:toast 5s 1.4s var(--ease) infinite both}
@keyframes toast{0%{opacity:0;transform:translateY(20px)}8%,60%{opacity:1;transform:none}70%,100%{opacity:0;transform:translateY(20px)}}
/* ===== המלצות ===== */
.feat{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}.feat:first-of-type{border-top:0}
.feat .ic{width:38px;height:38px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:0 0 auto;transition:background .3s,color .3s}
.feat.on .ic{background:var(--acc);color:var(--acc-ink)}
.feat .tx{flex:1;min-width:0}.feat .tx b{display:block;font-weight:600}.feat .tx span{display:block;font-size:13px;color:var(--muted)}
.feat .rs{display:inline-block!important;font-size:12px!important;color:var(--ink2)!important;background:var(--bg);border-radius:6px;padding:1px 7px;margin-top:6px}
.sw{flex:0 0 auto;width:44px;height:26px;border-radius:99px;background:var(--line2);border:0;position:relative;cursor:pointer;transition:background .3s}.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .35s var(--spring)}
.sw[aria-checked=true]{background:var(--ink)}.sw[aria-checked=true]::after{inset-inline-start:21px}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:15px;font-weight:700}.sec-h .n{margin-inline-start:auto;font-size:12.5px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.always{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.next-up{border:1px dashed var(--line2);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
.priv h2{display:flex;align-items:center;gap:8px;margin-top:4px}.priv ul{margin:0 0 14px;padding-inline-start:20px;color:var(--ink2)}.priv li{margin:4px 0}
.count{font-variant-numeric:tabular-nums}

/* ===== פתיח קולנועי ===== */
#hero{position:fixed;inset:0;z-index:40;background:#0b0c0f;color:#f4f1ea;overflow:hidden;display:grid;place-items:center}
#hero .hg{position:absolute;inset:-4%;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;gap:10px;padding:4vh 4vw;transform:perspective(1200px) rotateX(18deg) rotateZ(-6deg) scale(1.15);transform-origin:50% 30%;opacity:.9;transition:transform 1.1s var(--ease),opacity .9s}
#hero .c{border-radius:10px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);opacity:0;transform:scale(.7);animation:cIn .7s var(--ease) forwards;animation-delay:var(--d)}
#hero .c.f{background:rgba(244,241,234,.09)}#hero .c.f2{background:rgba(244,241,234,.16)}
#hero .c.y{background:#ffcf33;box-shadow:0 0 50px rgba(255,207,51,.45);animation:cIn .7s var(--ease) forwards,glow 2.4s 1.8s ease-in-out infinite;animation-delay:var(--d),calc(var(--d) + .8s)}
#hero .c.x{background:transparent;border-color:rgba(255,92,92,.35);background-image:repeating-linear-gradient(135deg,rgba(255,92,92,.12) 0 6px,transparent 6px 12px)}
@keyframes cIn{to{opacity:1;transform:none}}@keyframes glow{50%{box-shadow:0 0 90px rgba(255,207,51,.7)}}
#hero .nowl{position:absolute;left:0;right:0;height:2px;top:22%;background:linear-gradient(90deg,transparent,#ffcf33 30%,#ffcf33 70%,transparent);box-shadow:0 0 24px #ffcf33;opacity:0;animation:nowl 7s 1.2s linear infinite}
@keyframes nowl{0%{top:12%;opacity:0}8%{opacity:.9}92%{opacity:.9}100%{top:92%;opacity:0}}
#hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(11,12,15,.55),rgba(11,12,15,.25) 45%,rgba(11,12,15,.85) 85%);pointer-events:none}
#hero .hc{position:relative;z-index:2;text-align:center;padding:24px;max-width:760px;transition:transform .9s var(--ease),opacity .6s}
#hero .hb{display:inline-flex;align-items:center;gap:10px;font-weight:600;opacity:0;animation:fadeUp .8s .2s var(--ease) forwards}
#hero .hb .mark{background:#f4f1ea;color:#0b0c0f}
#hero h1{font-size:clamp(40px,8.5vw,92px);line-height:1.02;letter-spacing:-2px;margin:22px 0 18px;font-weight:700}
#hero .l{display:block;overflow:hidden;padding-bottom:.08em}#hero .w{display:inline-block;transform:translateY(110%);animation:wUp .9s var(--ease) forwards;animation-delay:var(--d)}
#hero .l.acc .w{color:#ffcf33}
@keyframes wUp{to{transform:none}}@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#hero p{font-size:clamp(16px,2.2vw,20px);color:#a9abb4;max-width:44ch;margin:0 auto 30px;opacity:0;animation:fadeUp .9s 1.3s var(--ease) forwards}
#hero .go{opacity:0;animation:fadeUp .9s 1.6s var(--ease) forwards;display:flex;flex-direction:column;align-items:center;gap:12px}
#hero .btn{background:#ffcf33;color:#1a1400;font-size:17px;padding:16px 30px;border-radius:14px;box-shadow:0 10px 40px -10px rgba(255,207,51,.6)}
#hero .go small{color:#6f727c;font-size:13px}
#hero.out .hg{transform:perspective(1200px) rotateX(0) rotateZ(0) scale(2.2);opacity:0}
#hero.out .hc{transform:translateY(-40px) scale(.96);opacity:0}
#hero.out{transition:opacity .5s .55s;opacity:0}
/* ===== וילון בין שלבים ===== */
#wipe{position:fixed;inset:0;z-index:30;pointer-events:none;visibility:hidden}
#wipe .y,#wipe .k{position:absolute;inset:0}
#wipe .y{background:#ffcf33}#wipe .k{background:#0b0c0f;display:grid;place-items:center;color:#f4f1ea}
#wipe.f .y{animation:wF .95s var(--ease) both}#wipe.f .k{animation:wF .95s .06s var(--ease) both}

for (const id of ["mk1", "mk2"]) $(id).innerHTML = ico("table");

function buildSteps() {

    <div class="ready"><div><h3>${esc(S.school.name || "בית הספר")}<br><span>מוכן.</span></h3><p>${nClasses()} כיתות · ${catalog().filter(isOn).length} תכונות · הכל לפי מה שבחרתם</p><button class="btn" type="button" id="toSum">לסיכום שלך${ARROW}</button></div></div>`;
  document.body.appendChild(b); requestAnimationFrame(() => b.classList.add("on")); document.body.style.overflow = "hidden";
  const lis = b.querySelectorAll("li"), scr = b.querySelector("#bscr"), bar = b.querySelector(".pbar i"), pct = b.querySelector(".pct b");

  const fill = n => { const rows = all.slice(0, Math.min(all.length, n)); scr.innerHTML = rows.map(([, h], i) => i === rows.length - 1 ? h.replace(/^<div class="/, '<div class="new ') : h).join("") + Array.from({ length: Math.max(0, 7 - rows.length) }, () => `<div class="sk"></div>`).join(""); };
  const count = (to, ms) => { const from = cur, t0 = performance.now(); const f = now => { const k = Math.min(1, (now - t0) / ms); cur = Math.round(from + (to - from) * k); pct.textContent = cur + "%"; if (k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); bar.style.width = to + "%"; };
  const end = () => { timers.forEach(clearTimeout); lis.forEach(l => l.className = "show ok"); count(100, 300); fill(all.length);

  timers.push(setTimeout(end, 500 + st.length * D));

function sparks(root) { if (RM) return; const r = root.querySelector(".bp").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 3;
  for (let i = 0; i < 26; i++) { const d = document.createElement("i"), a = Math.random() * Math.PI * 2, R = 120 + Math.random() * 220; d.className = "spark"; d.style.cssText = `left:${cx}px;top:${cy}px;--x:${Math.cos(a) * R}px;--y:${Math.sin(a) * R}px;animation-delay:${Math.random() * .3}s`; root.appendChild(d); setTimeout(() => d.remove(), 2200); } }
// 📝 סיכום אישי: מדבר עם המנהל כמו בן אדם, לפי מה שבחר
const VISION = { climate: "כל תלמיד מרגיש שייך ויודע שיש לו עם מי לדבר", wellbeing: "התלמידים פחות לחוצים ויש להם כלים להתמודד", attendance: "התלמידים מגיעים, ובזמן", bagrut: "כל תלמיד מגיע לבגרות מוכן, עם יותר יחידות", excellence: "מי שרוצה לפרוץ קדימה מקבל את הבמה", social: "התלמידים נותנים מעצמם לקהילה", service: "כל בוגר יוצא לשירות משמעותי", parents: "ההורים שותפים ויודעים מה קורה בזמן", values: "הזהות והערכים שלכם נוכחים בכל יום", digital: "התלמידים משתמשים בטכנולוגיה בתבונה", gaps: "אף תלמיד לא נשאר מאחור", staff: "המורים עובדים פחות קשה ומרגישים יותר טוב" };

   <div class="letter"><p><b>${esc(S.school.name || "בית הספר")}</b>${S.school.city ? ` ב${esc(S.school.city)}` : ""} הוא ${esc(SECN[S.sector] || "בית ספר")}${S.gender === "boys" ? " לבנים" : S.gender === "girls" ? " לבנות" : ""}${S.dorm === "all" ? " עם פנימייה" : S.dorm === "some" ? ", וחלק מהתלמידים בפנימייה" : ""}, עם ${gs.map(x => x[1]).join(", ")}. ${role ? `ההקמה נעשתה על ידי ${esc(S.school.who)} (${role}).` : ""}</p>

function countUp() { document.querySelectorAll(".count[data-n]").forEach((el, i) => { const n = +el.dataset.n, t0 = performance.now() + i * 120; const f = now => { const k = Math.max(0, Math.min(1, (now - t0) / 900)); el.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }); }
// 🎬 פתיח: מערכת שעות שמתמלאת לבד, קו "עכשיו" עובר, והכותרת עולה מילה אחרי מילה
