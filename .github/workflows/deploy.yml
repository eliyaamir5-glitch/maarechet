# פריסה אוטומטית ל-GitHub Pages בכל push ל-main.
# השלב "node gen-cal.js" מייצר מחדש את 36 קובצי היומן מ-data.js לפני הפרסום.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate calendar files
        run: node gen-cal.js
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html data.js sw.js cal _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
