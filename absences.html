<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5b6cff">
<title>הנוכחות שלי</title>
<script src="demo-shim.js"></script>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}
:root{
  --bg:#0f1226; --card:#1d2247; --ink:#f4f5ff; --muted:#9aa0c7; --line:#2b3162;
  --next:#243a8a; --break:#2a2f5c; --accent:#7c8cff; --accent-ink:#0b0e24;
  --green:#3ddc97; --yellow:#ffd23f; --orange:#ffb03f; --red:#ff5d6c; --blue:#5bc0ff; --grey:#9aa0c7; --fire:#ff8a3d;
  --grad:linear-gradient(135deg,#5b6cff 0%,#a259ff 60%,#ff6bd6 100%);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f2fb; --card:#ffffff; --ink:#191b33; --muted:#6c7093; --line:#e3e2f2; --next:#e5e9ff; --break:#eceaf7; --accent:#5b6cff; --accent-ink:#fff; --green:#1fb57a; --orange:#e08a00; --red:#e0384a; --blue:#1b8fd6; --yellow:#e0a800; --fire:#e8620c; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.top{background:var(--grad);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 20px;border-radius:0 0 28px 28px}
.top a{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:16px;font-weight:700;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);border-radius:999px;padding:10px 18px;margin-bottom:6px}
.top h1{margin:6px 0 0;font-size:26px;font-weight:900}
.top p{margin:4px 0 0;font-size:14px;opacity:.85}
main{padding:16px 14px 40px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px;font-weight:900}
.sec{font-size:18px;font-weight:900;margin:18px 4px 8px}
.sec small{font-size:13px;font-weight:400;color:var(--muted)}
.hint{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 8px}
.btn{border:none;border-radius:12px;padding:11px 16px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:var(--break);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.item{padding:9px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5}
.item:first-of-type{border-top:none}
.demo{background:var(--next);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;margin-bottom:12px}
.demo a{color:var(--accent)}
.slim{padding:12px 16px}
.foot{margin-top:16px;color:var(--muted);font-size:12px;text-align:center;line-height:1.6}
[hidden]{display:none!important}

/* כניסה מדורגת: הכרטיסים "עולים" אחד אחרי השני */
.rv{opacity:0;transform:translateY(16px);animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* מצב 30% */
.status{border:none;color:#fff;position:relative;overflow:hidden}
.status *{color:#fff}
.status.ok{background:linear-gradient(135deg,#1fb57a,#2a8f6a)}
.status.warn{background:linear-gradient(135deg,#e08a00,#c4562a)}
.status.bad{background:linear-gradient(135deg,#e0384a,#8a1f5a)}
.status .big{font-size:22px;font-weight:900;margin-bottom:6px}
.status .item{border-color:rgba(255,255,255,.25)}
.status::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s ease-in-out 1s infinite}
@keyframes shine{0%{transform:translateX(100%)}60%,100%{transform:translateX(-100%)}}

/* מקצוע: טבעת + רצף */
.subj{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.subj.hot{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,93,108,.18)}
.subj svg{flex:0 0 66px}
.subj .n{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.subj .tag{border-radius:8px;padding:1px 8px;font-size:11px;font-weight:900;color:#111}
.subj .s{font-size:13px;color:var(--muted);line-height:1.55;margin-top:2px}
.subj .tch{font-size:13px;font-weight:500;margin-top:2px;overflow-wrap:anywhere}
.subj .c{font-size:13px;font-weight:700;margin-top:2px}
.stk{display:inline-flex;align-items:center;gap:3px;font-weight:900;font-size:14px;color:var(--fire)}
.stk .f{display:inline-block;animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%;filter:drop-shadow(0 0 6px rgba(255,140,40,.8))}
.stk.mid .f{font-size:18px}.stk.big .f{font-size:21px}
.stk.blue{color:var(--blue)}.stk.blue .f{font-size:22px;filter:hue-rotate(185deg) saturate(1.6) drop-shadow(0 0 8px rgba(80,180,255,1))}
.stk.ash{color:var(--muted)}.stk.ash .f{filter:grayscale(1);opacity:.6;animation:none}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.14,1.2) rotate(3deg)}}
.brk{color:var(--red);font-size:12px;font-weight:700}

/* רצף מוביל */
.lead{display:flex;align-items:center;gap:14px;border:none;background:radial-gradient(circle at 85% 40%,rgba(255,140,40,.35),transparent 55%),linear-gradient(160deg,#2a1640,#1d2247);color:#fff}
.lead.blue{background:radial-gradient(circle at 85% 40%,rgba(60,170,255,.45),transparent 55%),linear-gradient(160deg,#0c2246,#1d2247)}
.lead *{color:#fff}
.lead .bf{font-size:58px;line-height:1;animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%;filter:drop-shadow(0 0 16px rgba(255,140,40,.9))}
.lead.blue .bf{filter:hue-rotate(185deg) saturate(1.6) drop-shadow(0 0 18px rgba(80,180,255,1))}
.lead .ln{font-size:40px;font-weight:900;line-height:1}
.lead .ls{font-size:14px;opacity:.9;line-height:1.5}

/* גרפים */
.donutwrap{display:flex;align-items:center;gap:16px}
.donutwrap svg{flex:0 0 150px}
.legend{flex:1;font-size:14px;line-height:1.9}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.seg,.rg{transition:stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1)}
.days{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:6px}
.days div{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.days b{display:block;margin:0 auto 4px;width:70%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--red),var(--orange));height:0;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}

/* אירועים */
.ev{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:none}
.ev .ei{font-size:22px;line-height:1}
.ev .et{font-size:15px;line-height:1.4}.ev .et small{display:block;color:var(--muted);font-size:13px}
.ev.praise .et b{color:var(--yellow)}
details summary{cursor:pointer;font-weight:700;margin:6px 0 10px}
.tgl{display:flex;gap:8px;align-items:center;font-size:14px}
/* מגירת הפירוט: הדברים הפחות חשובים, נפתחת רק כשרוצים */
.drw-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1.5px dashed var(--line);border-radius:20px;padding:14px 16px;margin:6px 0 12px;font:inherit;color:var(--ink);cursor:pointer}
.drw-btn .di{font-size:26px}.drw-btn b{display:block;font-size:16px}.drw-btn small{color:var(--muted);font-size:13px}
.drw-btn .dc{margin-inline-start:auto;font-size:22px;color:var(--muted)}
#drw{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
#drw[hidden]{display:none}
#drw .bk{position:absolute;inset:0;background:rgba(5,6,20,.55);animation:dfade .25s both}
#drw .sh{position:relative;width:100%;max-width:640px;margin:0 auto;max-height:86vh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:24px 24px 0 0;padding:0 14px calc(22px + env(safe-area-inset-bottom));animation:dup .38s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
#drw .hd{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
#drw .hd h2{margin:0;font-size:19px;font-weight:900}
#drw .grab{position:absolute;top:6px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--line)}
#drw .hd .x{border:none;background:var(--break);color:var(--ink);border-radius:999px;width:38px;height:38px;font-size:18px;cursor:pointer;margin-top:10px}
#drw .hd h2{margin-top:10px}
@keyframes dup{from{transform:translateY(100%)}}@keyframes dfade{from{opacity:0}}
body.noscroll{overflow:hidden}
</style>
</head>
<body>
<div class="top">
  <a href="./">🏠 חזרה למערכת</a>
  <h1>📊 הנוכחות שלי</h1>
  <p>רצף לכל מקצוע וכלל ה-30% · פרטי לך בלבד</p>
</div>
<main id="main"></main>

<script src="data.js"></script>
<script src="mashov.js"></script>
<script src="absences.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const pct=x=>Math.round(x*100)+"%";
const DAYN=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const fmtD=iso=>{const[y,m,d]=iso.split("-");return `${+d}.${+m}`};
const COLOR={green:"var(--green)",orange:"var(--orange)",red:"var(--red)",lost:"var(--red)",early:"var(--grey)"};
const LABEL={green:"תקין",orange:"לשים לב",red:"מסוכן",lost:"עבר את ה-30%",early:"מוקדם לשפוט"};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}};
let profile=load("profile",null);
if(profile&&!profile.major&&profile.phys==="yes")profile.major="phys";
let countJustified=true;try{countJustified=localStorage.getItem("absCountJustified")!=="0"}catch(e){}
let demo=location.hash==="#demo";

// נתוני דוגמה: כדי לראות את המסך לפני שמחברים משוב
function demoBehave(){
  const ev=[],add=(date,subject,lesson,type="חיסור",j=0,txt="")=>ev.push({date,subject,lesson,type,justificationId:j,justification:txt});
  const days=["2026-09-01","2026-09-02","2026-09-06","2026-09-07","2026-09-08","2026-09-09","2026-09-14","2026-09-15","2026-09-16","2026-09-22","2026-09-23","2026-10-05","2026-10-06","2026-10-11","2026-10-12"];
  days.forEach((d,i)=>{if(new Date(d+"T12:00").getDay()!==0)add(d,"תפילת שחרית",0);if(i%3!==2)add(d,"גמרא",1)});
  ["2026-09-07","2026-09-08","2026-10-05"].forEach(d=>add(d,"אנגלית",6));
  add("2026-09-15","מתמטיקה",7,"חיסור",4,"מחלה");add("2026-09-16","מתמטיקה",2,"חיסור",4,"מחלה");add("2026-10-07","מתמטיקה",2,"איחור");
  add("2026-09-17","פיזיקה",8,"צל\"ש");add("2026-10-07","מתמטיקה",2,"צל\"ש");add("2026-10-13","היסטוריה",4,"הפרעה בשיעור");add("2026-10-14","גמרא",2,"צל\"ש");
  add("2026-10-11","אנגלית",6,"חוסר ציוד");add("2026-10-08","כימיה",3);
  return ev;
}

// SVG עוגה: הקטעים מתחילים ריקים ומתמלאים (ראה animate())
function donut(parts,center,sub){
  const total=parts.reduce((a,p)=>a+p.v,0)||1,R=60,C=2*Math.PI*R;let off=0;
  const segs=parts.filter(p=>p.v>0).map(p=>{const len=p.v/total*C;const s=`<circle class="seg" r="${R}" cx="75" cy="75" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="0 ${C}" data-to="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`;off+=len;return s}).join("");
  return `<svg viewBox="0 0 150 150" width="150" height="150"><circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--break)" stroke-width="22"/>${segs}<text x="75" y="76" text-anchor="middle" font-size="28" font-weight="900" fill="currentColor" data-count="${center}" data-suffix="%">0%</text><text x="75" y="98" text-anchor="middle" font-size="12" fill="var(--muted)">${sub}</text></svg>`;
}
// טבעת למקצוע: סקאלה 0–40%, קו אדום ב-30%
function ring(p,color){
  const R=27,C=2*Math.PI*R,f=Math.min(1,p/0.4),ang=(0.3/0.4*360-90)*Math.PI/180;
  const x1=33+(R-6)*Math.cos(ang),y1=33+(R-6)*Math.sin(ang),x2=33+(R+6)*Math.cos(ang),y2=33+(R+6)*Math.sin(ang);
  return `<svg viewBox="0 0 66 66" width="66" height="66"><circle r="${R}" cx="33" cy="33" fill="none" stroke="var(--break)" stroke-width="8"/><circle class="rg" r="${R}" cx="33" cy="33" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 ${C}" data-to="${f*C} ${C}" transform="rotate(-90 33 33)"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--red)" stroke-width="2.5"/><text x="33" y="38" text-anchor="middle" font-size="14" font-weight="900" fill="${color}" data-count="${Math.round(p*100)}" data-suffix="%">0%</text></svg>`;
}
const stkHTML=(s,label)=>{const t=Absences.tierOf(s.current);return `<span class="stk ${t.cls}"><span class="f">🔥</span><span data-count="${s.current}">0</span>${label?` <span style="font-weight:700">${label}</span>`:""}</span>`};

function render(){
  const m=$("main");
  if(!profile||!profile.major){m.innerHTML=`<div class="card"><h2>קודם נרשמים</h2><p class="hint">צריך להשלים את ההרשמה במערכת (כיתה, הקבצות ומגמה) כדי לחשב את הנוכחות שלך.</p><a class="btn" href="./">להרשמה</a></div>`;return}
  const conn=Mashov.connected(), md=Mashov.data();
  if(!conn&&!demo){
    m.innerHTML=`<div class="card lead rv"><span class="bf">🔥</span><div><div class="ln" style="font-size:22px">רצף לכל מקצוע ומעקב 30%</div>
      <div class="ls">כל שיעור שאתה מגיע אליו מוסיף לרצף של המקצוע, ותמיד רואים איפה אתה עומד מול ה-30%. מחברים את משוב, והכל נשאר רק אצלך בטלפון.</div>
      <div class="row" style="margin-top:12px"><a class="btn" href="./#profile">חבר משוב</a><button class="btn ghost" id="demoBtn">הצג דוגמה</button></div></div></div>`;
    $("demoBtn").onclick=()=>{demo=true;history.replaceState(null,"","#demo");render()};
    animate();return;
  }
  const behave=demo?demoBehave():(md?.behave||[]);
  let until,untilMin;
  if(demo){until="2026-10-15";untilMin=24*60}else{const at=new Date(md?.at||Date.now());until=`${at.getFullYear()}-${String(at.getMonth()+1).padStart(2,"0")}-${String(at.getDate()).padStart(2,"0")}`;untilMin=at.getHours()*60+at.getMinutes()}
  const days=profile.cls==="y1"?DAYS_Y1:DAYS_Y2, D={ENG,MATH,MAJORS};
  const r=Absences.analyze({days,profile,data:D,year:SCHOOL_YEAR,behave,today:demo?"2026-10-15":until,countJustified,nonBagrut:NON_BAGRUT});
  const tl=Absences.timeline({days,profile,data:D,year:SCHOOL_YEAR,behave,until,untilMin});
  const SS=Absences.subjectStreaks(tl.blocks), B=tl.blocks;
  const bag=r.subjects.filter(s=>!s.nonBagrut), extra=r.subjects.filter(s=>s.nonBagrut);
  const red=bag.filter(s=>s.status==="red"||s.status==="lost"), near=bag.filter(s=>s.status==="orange"&&s.pct>=0.20);
  let h="",d=0;const rv=()=>`rv" style="animation-delay:${(d++)*70}ms`;

  if(demo)h+=`<div class="demo">👀 מצב דוגמה: אלה לא הנתונים שלך. <a href="#" id="exitDemo">יציאה מהדוגמה</a></div>`;
  else h+=`<div class="card slim ${rv()}"><div class="bar"><span>📊 משוב · ${Mashov.agoText()}${md?.partial?" · חלק מהנתונים לא נמשכו":""}</span><button class="btn ghost" id="refresh" style="padding:7px 12px;font-size:13px">רענן</button></div><div class="hint" id="refMsg" style="margin:4px 0 0"></div></div>`;

  // 1. מצב ה-30%
  if(red.length){
    h+=`<div class="card status bad ${rv()}"><div class="big">🚨 מצב חילוץ</div>`;
    for(const s of red){
      if(s.status==="lost")h+=`<div class="item"><b>${esc(s.name)}</b>: ${s.counted} חיסורים, יותר מ-30% מכל שעות השנה. צריך לדבר עוד השבוע עם המחנך ועם המורה, ולבדוק אילו חיסורים אפשר להצדיק.</div>`;
      else h+=`<div class="item"><b>${esc(s.name)}</b>: ${pct(s.pct)}. כדי לחזור מתחת ל-25% צריך <b>${s.needConsecutive} שעות ברצף</b>${s.weeksToRecover?(s.weeksToRecover===1?" (כשבוע)":` (כ-${s.weeksToRecover} שבועות)`):""}. עד סוף השנה מותר עוד <b>${Math.max(0,s.allowedLeft)}</b> חיסורים.</div>`;
    }
    h+=`<div class="item" style="font-size:13px;opacity:.9">השיעורים האלה מסומנים במערכת ב"⚠️ חובה להגיע".</div></div>`;
  }else if(near.length){
    h+=`<div class="card status warn ${rv()}"><div class="big">⚠️ מתקרבים ל-25%</div>${near.map(s=>`<div class="item"><b>${esc(s.name)}</b>: ${pct(s.pct)} מהשיעורים שהיו. עד סוף השנה מותר עוד ${s.allowedLeft}. לא מפספסים בשבועות הקרובים.</div>`).join("")}</div>`;
  }else if(bag.some(s=>s.held>0)){
    h+=`<div class="card status ok ${rv()}"><div class="big">✅ כל הכבוד, אתה בשליטה</div><div style="font-size:15px">אין מקצוע שמתקרב ל-25%. ככה ממשיכים 💪</div></div>`;
  }

  // 2. הרצף הכי חזק עכשיו
  const lead=Object.entries(SS).filter(([n])=>!NON_BAGRUT.includes(n)).sort((a,b)=>b[1].current-a[1].current)[0];
  if(lead&&lead[1].current>0){
    const t=Absences.tierOf(lead[1].current);
    h+=`<div class="card lead ${t.cls==="blue"?"blue":""} ${rv()}"><span class="bf">🔥</span><div><div class="ls">הרצף הכי חזק שלך עכשיו</div><div class="ln"><span data-count="${lead[1].current}">0</span> <span style="font-size:20px">ב${esc(lead[0])}</span></div><div class="ls">שיעורים ברצף בלי חיסור · ${t.msg}</div></div></div>`;
  }

  // 3. המקצועות שלי: אחוז + רצף לכל מקצוע
  h+=`<div class="sec ${rv()}">המקצועות שלי <small>· אחוז חיסורים ורצף בכל מקצוע</small></div>`;
  h+=bag.map(s=>subjCard(s,SS[s.name],rv())).join("");

  // 4. השבוע
  if(r.thisWeek.length)h+=`<div class="card ${rv()}"><h2>📅 לא מפספסים השבוע</h2>${r.thisWeek.map(w=>`<div class="item"><b style="color:${COLOR[w.status]}">●</b> <b>${esc(w.name)}</b> · ${w.when.join(" · ")}</div>`).join("")}</div>`;

  // 5. עוגה: כל השיעורים שהיו
  const att=B.filter(b=>!b.missed&&!b.late).length, late=B.filter(b=>!b.missed&&b.late).length, mj=B.filter(b=>b.missed&&b.justified===true).length, mu=B.filter(b=>b.missed&&b.justified!==true).length;
  const attPct=B.length?Math.round((B.length-mj-mu)/B.length*100):100;
  h+=`<div class="card ${rv()}"><h2>🥧 כל השיעורים שהיו השנה</h2><div class="donutwrap">${donut([{v:att,c:"var(--green)"},{v:late,c:"var(--yellow)"},{v:mj,c:"var(--blue)"},{v:mu,c:"var(--red)"}],attPct,"הגעה")}
    <div class="legend"><div><i style="background:var(--green)"></i>הגעתי: <b data-count="${att}">0</b></div><div><i style="background:var(--yellow)"></i>באיחור: <b data-count="${late}">0</b></div><div><i style="background:var(--blue)"></i>חיסור מוצדק: <b data-count="${mj}">0</b></div><div><i style="background:var(--red)"></i>חיסור: <b data-count="${mu}">0</b></div></div></div></div>`;

  // 6. טיפים
  if(r.tips.length)h+=`<div class="card ${rv()}"><h2>💡 מה יעזור לך</h2>${r.tips.map(t=>`<div class="item">${t.icon} <b>${esc(t.title)}</b><br><span class="hint">${esc(t.text)}</span></div>`).join("")}</div>`;

  // ---- הפירוט: נכנס למגירה שנפתחת רק כשרוצים ----
  let dh="";
  const evs=B.flatMap(b=>b.events.map(e=>({...e,s:b.s,justifiedB:b.justified}))).reverse();
  if(evs.length){
    dh+=`<div class="card"><h2>📝 מה קרה בשיעורים</h2>${evs.slice(0,30).map((e,i)=>{
      const k=e.kind==="absence"&&e.justifiedB===true?"absenceJ":e.kind, ui=Absences.EVENT_UI[k]||Absences.EVENT_UI.other;
      return `<div class="ev ${e.kind}"><span class="ei">${ui.icon}</span><div class="et"><b>${esc(ui.label||e.type)}</b> ב${esc(e.subject)}<small>${DAYN[new Date(e.date+"T12:00").getDay()]} ${fmtD(e.date)} · ${esc(e.s)}${e.lesson!=null&&e.lesson!==""?` · שעה ${esc(e.lesson)}`:""}${ui.say[0]?` · ${esc(ui.say[i%ui.say.length])}`:""}</small></div></div>`}).join("")}
      ${evs.length>30?`<p class="hint" style="margin:8px 0 0">ועוד ${evs.length-30} מוקדמים יותר</p>`:""}</div>`;
  }
  const P=r.patterns, maxD=Math.max(1,...P.byWeekday.slice(0,5));
  if(P.total)dh+=`<div class="card"><h2>📈 חיסורים לפי ימים</h2><div class="days">${[0,1,2,3,4].map(i=>`<div><b data-h="${Math.round(P.byWeekday[i]/maxD*80)}"></b>${DAYN[i]}<br><span>${P.byWeekday[i]}</span></div>`).join("")}</div></div>`;
  if(extra.length)dh+=`<details><summary>תפילות ופעילויות (בלי בגרות)</summary>${extra.map(s=>subjCard(s,SS[s.name],"")).join("")}</details>`;
  if(r.unmatched.length)dh+=`<div class="card"><h2>לא שויך למקצוע</h2><p class="hint">הגיעו ממשוב עם שם מקצוע שלא נמצא במערכת שלך:</p>${r.unmatched.map(u=>`<div class="item">${esc(u.subject)}: ${u.absences} חיסורים</div>`).join("")}</div>`;
  dh+=`<div class="card slim"><label class="tgl"><input type="checkbox" id="cj" ${countJustified?"checked":""}> לספור גם חיסורים מוצדקים ב-30%</label><p class="hint" style="margin:4px 0 0">ברירת המחדל זהירה: סופרים הכל. אם בית הספר לא סופר חיסור עם אישור, אפשר לבטל.</p></div>`;
  dh+=`<p class="foot">⚠️ זו הערכה, לא קביעה רשמית של בית הספר. לפי המערכת האישית שלך, לוח החופשות של תשפ"ז ומה שמשוב מדווח. רצף: חיסור לא מוצדק שובר, מוצדק מקפיא, איחור שומר. הכל נשאר רק בטלפון שלך.</p>`;
  const nEv=evs.length;
  h+=`<button type="button" class="drw-btn ${rv()}" id="drwOpen"><span class="di">🗂️</span><span><b>פירוט מלא</b><small>${nEv?`${nEv} אירועים · `:""}חיסורים לפי ימים · תפילות · הגדרות</small></span><span class="dc">‹</span></button>`;
  h+=`<p class="foot ${rv()}">⚠️ הערכה בלבד, לא קביעה רשמית של בית הספר. הכל נשאר רק בטלפון שלך.</p>`;
  m.innerHTML=h;
  drawer(dh);

  if($("exitDemo"))$("exitDemo").onclick=e=>{e.preventDefault();demo=false;history.replaceState(null,"",location.pathname);render()};
  $("cj").onchange=e=>{countJustified=e.target.checked;try{localStorage.setItem("absCountJustified",countJustified?"1":"0")}catch(_){}render()};
  if($("refresh"))$("refresh").onclick=async e=>{e.target.disabled=true;$("refMsg").textContent="מרענן…";const x=await Mashov.refresh();e.target.disabled=false;if(x.ok)render();else $("refMsg").textContent=Mashov.message(x.error)+(x.error==="need_password"?" (בפרופיל במסך הראשי)":"")};
  animate();
}

// המגירה: נבנית מחדש בכל ציור, ונשארת פתוחה אם הייתה פתוחה
let drwOpen=false;
function drawer(html){
  let el=$("drw");
  if(!el){el=document.createElement("div");el.id="drw";el.hidden=true;el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");
    el.innerHTML=`<div class="bk"></div><div class="sh"><span class="grab"></span><div class="hd"><h2>🗂️ פירוט מלא</h2><button type="button" class="x" aria-label="סגור">✕</button></div><div id="drwBody"></div></div>`;
    document.body.append(el);
    el.querySelector(".bk").onclick=el.querySelector(".x").onclick=()=>setDrawer(false);
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&drwOpen)setDrawer(false)});
    // החלקה למטה סוגרת
    const sh=el.querySelector(".sh");let y0=null;
    sh.addEventListener("touchstart",e=>{y0=sh.scrollTop<=0?e.touches[0].clientY:null},{passive:true});
    sh.addEventListener("touchmove",e=>{if(y0!=null&&e.touches[0].clientY-y0>0)sh.style.transform=`translateY(${e.touches[0].clientY-y0}px)`},{passive:true});
    sh.addEventListener("touchend",e=>{const dy=y0==null?0:(e.changedTouches[0].clientY-y0);sh.style.transform="";y0=null;if(dy>90&&sh.scrollTop<=0)setDrawer(false)});
    sh.addEventListener("touchcancel",()=>{sh.style.transform="";y0=null});
  }
  $("drwBody").innerHTML=html;
  if($("drwOpen"))$("drwOpen").onclick=()=>setDrawer(true);
  if(drwOpen)setDrawer(true,true);
}
function setDrawer(open,quiet){
  const el=$("drw");if(!el)return;drwOpen=open;el.hidden=!open;document.body.classList.toggle("noscroll",open);
  if(open&&!quiet){el.querySelector(".sh").scrollTop=0;el.querySelectorAll(".days b[data-h]").forEach(b=>b.style.height="0");setTimeout(animate,60)}
  if(open&&quiet)animate();
}

function subjCard(s,st,cls){
  const c=COLOR[s.status],hot=s.status==="red"||s.status==="lost";
  st=st||{current:0,best:0,lastBreak:null};
  const broke=st.current===0&&st.lastBreak;
  return `<div class="subj ${hot?"hot":""} ${cls}">${ring(s.pct,c)}<div style="flex:1;min-width:0">
    <div class="n">${esc(s.name)}<span class="tag" style="background:${c}">${LABEL[s.status]}</span></div>
    ${s.teacher?`<div class="tch">👤 ${esc(s.teacher)}</div>`:""}
    <div class="s">${stkHTML(st,"ברצף")}${st.best>st.current?` · שיא ${st.best}`:""}${broke?` · <span class="brk">💔 נשבר ב-${fmtD(st.lastBreak.date)}, בונים מחדש</span>`:""}</div>
    <div class="s">חיסורים: <b>${s.absences}</b>${s.justified?` (${s.justified} מוצדקים)`:""}${s.lates?` · איחורים: ${s.lates}`:""}${s.nonBagrut?"":` · עוד מותר: <b>${Math.max(0,s.allowedLeft)}</b>`}</div>
    <div class="c" style="color:${c}">${esc(Absences.cheer(s))}</div></div></div>`;
}

// אנימציות: עוגה וטבעות מתמלאות, מספרים רצים, עמודות גדלות
function animate(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll("[data-to]").forEach(el=>el.setAttribute("stroke-dasharray",el.dataset.to));
    document.querySelectorAll(".days b[data-h]").forEach(el=>el.style.height=el.dataset.h+"px");
  }));
  const els=[...document.querySelectorAll("[data-count]")],t0=performance.now(),dur=1100;
  (function step(now){const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
    for(const el of els)el.textContent=Math.round(Number(el.dataset.count)*e)+(el.dataset.suffix||"");
    if(k<1)requestAnimationFrame(step)})(t0);
  // גיבוי: אם האנימציה לא רצה (למשל כשהמסך מוסתר), המספרים בכל זאת מגיעים לערך הסופי
  setTimeout(()=>{for(const el of els)el.textContent=el.dataset.count+(el.dataset.suffix||"");
    document.querySelectorAll("[data-to]").forEach(el=>el.setAttribute("stroke-dasharray",el.dataset.to));
    document.querySelectorAll(".days b[data-h]").forEach(el=>el.style.height=el.dataset.h+"px")},dur+400);
}

render();
Mashov.autoRefresh().catch(()=>{});
document.addEventListener("mashov-updated",render);
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
</script>
