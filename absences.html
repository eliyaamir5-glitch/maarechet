<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5b6cff">
<title>הנוכחות שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}
:root{
  --bg:#0f1226; --card:#1d2247; --ink:#f4f5ff; --muted:#9aa0c7; --line:#2b3162;
  --next:#243a8a; --break:#2a2f5c; --accent:#7c8cff; --accent-ink:#0b0e24;
  --green:#3ddc97; --yellow:#ffd23f; --orange:#ffb03f; --red:#ff5d6c; --blue:#5bc0ff; --grey:#9aa0c7;
  --grad:linear-gradient(135deg,#5b6cff 0%,#a259ff 60%,#ff6bd6 100%);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f2fb; --card:#ffffff; --ink:#191b33; --muted:#6c7093; --line:#e3e2f2; --next:#e5e9ff; --break:#eceaf7; --accent:#5b6cff; --accent-ink:#fff; --green:#1fb57a; --orange:#e08a00; --red:#e0384a; --blue:#1b8fd6; --yellow:#e0a800; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.top{background:var(--grad);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 20px;border-radius:0 0 28px 28px}
.top a{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:16px;font-weight:700;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);border-radius:999px;padding:10px 18px;margin-bottom:6px}
.top h1{margin:6px 0 0;font-size:26px;font-weight:900}
.top p{margin:4px 0 0;font-size:14px;opacity:.85}
main{padding:16px 14px 40px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px;font-weight:900}
.hint{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 8px}
.btn{border:none;border-radius:12px;padding:11px 16px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:var(--break);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.item{padding:9px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5}
.item:first-of-type{border-top:none}
.demo{background:var(--next);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;margin-bottom:12px}
.demo a{color:var(--accent)}
.foot{margin-top:16px;color:var(--muted);font-size:12px;text-align:center;line-height:1.6}
[hidden]{display:none!important}

/* ---- רצף 🔥 ---- */
.streak{position:relative;overflow:hidden;text-align:center;padding:22px 16px 18px;border:none;background:radial-gradient(circle at 50% 30%,rgba(255,140,40,.35),transparent 60%),linear-gradient(160deg,#2a1640,#1d2247)}
.streak.blue{background:radial-gradient(circle at 50% 30%,rgba(60,170,255,.45),transparent 60%),linear-gradient(160deg,#0c2246,#1d2247)}
.streak.ash{background:linear-gradient(160deg,#2a2f4a,#1d2247)}
.streak *{color:#fff}
.fire{display:inline-block;line-height:1;filter:drop-shadow(0 0 18px rgba(255,140,40,.9));animation:flicker 1.6s ease-in-out infinite;transform-origin:50% 90%}
.fire.small{font-size:54px}.fire.mid{font-size:76px}.fire.big{font-size:100px}
.fire.blue{font-size:110px;filter:hue-rotate(185deg) saturate(1.6) drop-shadow(0 0 26px rgba(80,180,255,1))}
.fire.ash{font-size:54px;filter:grayscale(1) opacity(.6);animation:none}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}25%{transform:scale(1.06,1.1) rotate(2deg)}50%{transform:scale(.97,1.03) rotate(-1deg)}75%{transform:scale(1.04,1.08) rotate(1deg)}}
.snum{font-size:64px;font-weight:900;line-height:1;margin-top:4px;text-shadow:0 0 22px rgba(255,170,60,.8)}
.streak.blue .snum{text-shadow:0 0 22px rgba(90,190,255,.9)}
.slabel{font-size:16px;font-weight:700;opacity:.9}
.smsg{font-size:14px;opacity:.85;margin-top:8px;line-height:1.5}
.smeta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.smeta span{background:rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.prog{height:8px;background:rgba(255,255,255,.15);border-radius:99px;margin:12px auto 4px;max-width:280px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffb03f,#ff5d6c);border-radius:99px}
.streak.blue .prog i{background:linear-gradient(90deg,#5bc0ff,#a259ff)}
.broken{margin-top:12px;background:rgba(255,93,108,.18);border:1.5px solid rgba(255,93,108,.6);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5;animation:shake .6s ease 1}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ---- גרפים ---- */
.donutwrap{display:flex;align-items:center;gap:16px}
.donutwrap svg{flex:0 0 150px}
.legend{flex:1;font-size:14px;line-height:1.9}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.days{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:6px}
.days div{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.days b{display:block;margin:0 auto 4px;width:70%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--red),var(--orange));min-height:3px}

/* ---- הישגים ---- */
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach>div{border:1.5px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;font-size:12px;line-height:1.3;position:relative}
.ach .ic{font-size:28px;display:block;margin-bottom:4px}
.ach .got{border-color:var(--yellow);background:linear-gradient(160deg,rgba(255,210,63,.18),transparent);box-shadow:0 0 14px rgba(255,210,63,.25)}
.ach .lock .ic{filter:grayscale(1);opacity:.45}
.ach .lock{color:var(--muted)}
.ach .mini{height:4px;background:var(--break);border-radius:9px;margin-top:6px;overflow:hidden}
.ach .mini i{display:block;height:100%;background:var(--accent)}
.ach .new{position:absolute;top:-8px;inset-inline-start:-6px;background:var(--red);color:#fff;border-radius:99px;padding:1px 7px;font-size:10px;font-weight:900}

/* ---- אירועים ---- */
.ev{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:none}
.ev .ei{font-size:22px;line-height:1}
.ev .et{font-size:15px;line-height:1.4}.ev .et small{display:block;color:var(--muted);font-size:13px}
.ev.praise .et b{color:var(--yellow)}

/* ---- מקצועות ---- */
.subj{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.subj svg{flex:0 0 64px}
.subj .n{font-weight:700;font-size:16px}
.subj .s{font-size:13px;color:var(--muted);line-height:1.5}
.subj .c{font-size:13px;font-weight:700;margin-top:2px}
.rescue{border-color:var(--red);background:linear-gradient(135deg,rgba(255,93,108,.18),transparent)}
.warn{border-color:var(--orange);background:linear-gradient(135deg,rgba(255,176,63,.16),transparent)}
.good{border-color:var(--green)}
details summary{cursor:pointer;font-weight:700;margin:6px 0 10px}
.tgl{display:flex;gap:8px;align-items:center;font-size:14px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--grad);color:#fff;border-radius:18px;padding:16px 18px;font-size:15px;line-height:1.5;box-shadow:0 14px 34px rgba(0,0,0,.35);z-index:60;animation:pop .4s ease;text-align:center}
.toast b{font-size:19px;display:block}
@keyframes pop{from{transform:translateY(20px) scale(.9);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="top">
  <a href="./">🏠 חזרה למערכת</a>
  <h1>📊 הנוכחות שלי</h1>
  <p>רצף, הישגים וכלל ה-30% · פרטי לך בלבד</p>
</div>
<main id="main"></main>
<canvas id="confetti"></canvas>

<script src="data.js"></script>
<script src="mashov.js"></script>
<script src="absences.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const pct=x=>Math.round(x*100)+"%";
const DAYN=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const fmtD=iso=>{const[y,m,d]=iso.split("-");return `${+d}.${+m}`};
const COLOR={green:"var(--green)",orange:"var(--orange)",red:"var(--red)",lost:"var(--red)",early:"var(--grey)"};
const LABEL={green:"תקין",orange:"לשים לב",red:"מסוכן",lost:"עבר את ה-30%",early:"מוקדם לשפוט"};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let profile=load("profile",null);
if(profile&&!profile.major&&profile.phys==="yes")profile.major="phys";
let countJustified=load("absCountJustified",1)!==0&&localStorage.getItem("absCountJustified")!=="0";
let demo=location.hash==="#demo";

// נתוני דוגמה: כדי לראות את המסך לפני שמחברים משוב
function demoBehave(){
  const ev=[],add=(date,subject,lesson,type="חיסור",j=0,txt="")=>ev.push({date,subject,lesson,type,justificationId:j,justification:txt});
  const days=["2026-09-01","2026-09-02","2026-09-06","2026-09-07","2026-09-08","2026-09-09","2026-09-14","2026-09-15","2026-09-16","2026-09-22","2026-09-23","2026-10-05","2026-10-06"];
  days.forEach((d,i)=>{if(new Date(d+"T12:00").getDay()!==0)add(d,"תפילת שחרית",0);if(i%3!==2)add(d,"גמרא",1)});
  ["2026-09-07","2026-09-08","2026-10-05"].forEach(d=>add(d,"אנגלית",6));
  add("2026-09-15","מתמטיקה",7,"חיסור",4,"מחלה");add("2026-09-16","מתמטיקה",2,"חיסור",4,"מחלה");add("2026-10-07","מתמטיקה",2,"איחור");
  add("2026-09-17","פיזיקה",8,"צל\"ש");add("2026-10-07","מתמטיקה",2,"צל\"ש");add("2026-10-12","גמרא",2,"צל\"ש");add("2026-10-13","היסטוריה",4,"הפרעה בשיעור");add("2026-10-14","גמרא",2,"צל\"ש");
  add("2026-10-11","אנגלית",6,"חוסר ציוד");add("2026-10-08","כימיה",3);
  return ev;
}

// SVG: עוגה (דונאט)
function donut(parts,center,sub){
  const total=parts.reduce((a,p)=>a+p.v,0)||1,R=60,C=2*Math.PI*R;let off=0;
  const segs=parts.filter(p=>p.v>0).map(p=>{const len=p.v/total*C;const s=`<circle r="${R}" cx="75" cy="75" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`;off+=len;return s}).join("");
  return `<svg viewBox="0 0 150 150" width="150" height="150"><circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--break)" stroke-width="22"/>${segs}<text x="75" y="76" text-anchor="middle" font-size="28" font-weight="900" fill="currentColor">${center}</text><text x="75" y="98" text-anchor="middle" font-size="12" fill="var(--muted)">${sub}</text></svg>`;
}
// SVG: טבעת למקצוע, סקאלה 0–40% עם קו ב-30%
function ring(p,color){
  const R=26,C=2*Math.PI*R,f=Math.min(1,p/0.4),mark=0.3/0.4*360-90,rad=mark*Math.PI/180;
  const mx=32+R*Math.cos(rad),my=32+R*Math.sin(rad),mx2=32+(R+9)*Math.cos(rad),my2=32+(R+9)*Math.sin(rad);
  return `<svg viewBox="0 0 64 64" width="64" height="64"><circle r="${R}" cx="32" cy="32" fill="none" stroke="var(--break)" stroke-width="8"/><circle r="${R}" cx="32" cy="32" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${f*C} ${C}" transform="rotate(-90 32 32)"/><line x1="${mx}" y1="${my}" x2="${mx2}" y2="${my2}" stroke="var(--red)" stroke-width="2.5"/><text x="32" y="37" text-anchor="middle" font-size="14" font-weight="900" fill="${color}">${Math.round(p*100)}%</text></svg>`;
}

function render(){
  const m=$("main");
  if(!profile||!profile.major){m.innerHTML=`<div class="card"><h2>קודם נרשמים</h2><p class="hint">צריך להשלים את ההרשמה במערכת (כיתה, הקבצות ומגמה) כדי לחשב את הנוכחות שלך.</p><a class="btn" href="./">להרשמה</a></div>`;return}
  const conn=Mashov.connected(), md=Mashov.data();
  if(!conn&&!demo){
    m.innerHTML=`<div class="card streak"><div class="fire mid">🔥</div><div class="slabel" style="margin-top:8px">רצפים, הישגים ומעקב 30%</div>
      <p class="smsg">כל שיעור שאתה מגיע אליו מוסיף לרצף, והאש גדלה. צל"שים פותחים הישגים. וכל הזמן רואים איפה אתה עומד מול ה-30%. בשביל זה מחברים את משוב, והכל נשאר רק אצלך בטלפון.</p>
      <div class="row" style="justify-content:center;margin-top:12px"><a class="btn" href="./#profile">חבר משוב</a><button class="btn ghost" id="demoBtn">הצג דוגמה</button></div></div>`;
    $("demoBtn").onclick=()=>{demo=true;history.replaceState(null,"","#demo");render()};
    return;
  }
  const behave=demo?demoBehave():(md?.behave||[]);
  // עד מתי סופרים: בדוגמה עד 15.10, אחרת עד העדכון האחרון ממשוב (שיעור נספר רק אם הסתיים)
  let until,untilMin;
  if(demo){until="2026-10-15";untilMin=24*60}else{const at=new Date(md?.at||Date.now());until=`${at.getFullYear()}-${String(at.getMonth()+1).padStart(2,"0")}-${String(at.getDate()).padStart(2,"0")}`;untilMin=at.getHours()*60+at.getMinutes()}
  const days=profile.cls==="y1"?DAYS_Y1:DAYS_Y2, D={ENG,MATH,MAJORS};
  const r=Absences.analyze({days,profile,data:D,year:SCHOOL_YEAR,behave,today:demo?"2026-10-15":undefined,countJustified,nonBagrut:NON_BAGRUT});
  const tl=Absences.timeline({days,profile,data:D,year:SCHOOL_YEAR,behave,until,untilMin});
  const st=Absences.streaks(tl.blocks), pr=Absences.praiseStreak(tl.blocks);
  const ach=Absences.achievements({blocks:tl.blocks,streak:st,praise:pr,subjects:r.subjects});
  const tier=Absences.tierOf(st.current);
  const bag=r.subjects.filter(s=>!s.nonBagrut), extra=r.subjects.filter(s=>s.nonBagrut);
  const red=bag.filter(s=>s.status==="red"||s.status==="lost"), near=bag.filter(s=>s.status==="orange"&&s.pct>=0.20);
  let h="";
  if(demo)h+=`<div class="demo">👀 מצב דוגמה: אלה לא הנתונים שלך. <a href="#" id="exitDemo">יציאה מהדוגמה</a></div>`;
  else h+=`<div class="card" style="padding:12px 16px"><div class="bar"><span>📊 משוב · ${Mashov.agoText()}${md?.partial?" · חלק מהנתונים לא נמשכו":""}</span><button class="btn ghost" id="refresh" style="padding:7px 12px;font-size:13px">רענן</button></div><div class="hint" id="refMsg" style="margin:4px 0 0"></div></div>`;

  // 🔥 רצף
  const next=[5,10,15,25,30,50,100,200].find(n=>n>st.current)||st.current+50;
  const prevStep=[0,5,10,15,25,30,50,100,200].filter(n=>n<=st.current).pop();
  h+=`<div class="card streak ${tier.cls==="blue"?"blue":tier.cls==="ash"?"ash":""}">
    <div class="fire ${tier.cls}">🔥</div>
    <div class="snum">${st.current}</div>
    <div class="slabel">שיעורים ברצף · ${tier.name}</div>
    <div class="prog"><i style="width:${Math.round((st.current-prevStep)/(next-prevStep)*100)}%"></i></div>
    <div class="smsg">${st.current?`עוד ${next-st.current} שיעורים ל-${next} ברצף. `:""}${tier.msg}</div>
    <div class="smeta"><span>🏆 שיא: ${st.best}</span><span>✅ הגעת ל-${pct(st.attendedPct)} מהשיעורים</span>${st.frozen?`<span>❄️ ${st.frozen} מוקפאים (מוצדק)</span>`:""}${pr.current>=2?`<span>⭐ ${pr.current} צל"שים ברצף</span>`:""}</div>
    ${st.lastBreak&&st.current<10?`<div class="broken">💔 <b>הרצף נשבר</b> ב${esc(st.lastBreak.subject)} (${DAYN[new Date(st.lastBreak.date+"T12:00").getDay()]} ${fmtD(st.lastBreak.date)})${st.lastBreak.lost?` אחרי ${st.lastBreak.lost} שיעורים`:""}. לא נורא, בונים מחדש: כל שיעור מוסיף עוד עץ למדורה 🔥</div>`:""}
  </div>`;

  // מצב 30%
  if(red.length){
    h+=`<div class="card rescue"><h2>🚨 מצב חילוץ</h2><p class="hint">במקצועות האלה חצית את ה-25%. השיעורים שלהם מסומנים במערכת ב"⚠️ חובה להגיע".</p>`;
    for(const s of red){
      if(s.status==="lost")h+=`<div class="item"><b>${esc(s.name)}</b>: ${s.counted} חיסורים, יותר מ-30% מכל שעות השנה (${s.limit} מתוך ${s.yearTotal}). <b>מה עושים:</b> לדבר עוד השבוע עם המחנך ועם המורה, ולבדוק אילו חיסורים אפשר להצדיק באישורים.</div>`;
      else h+=`<div class="item"><b>${esc(s.name)}</b>: ${pct(s.pct)} חיסורים. כדי לחזור מתחת ל-25% צריך להגיע ל-<b>${s.needConsecutive} שעות ברצף</b>${s.weeksToRecover?` (בערך ${s.weeksToRecover} שבועות)`:""}. עד סוף השנה מותר עוד <b>${Math.max(0,s.allowedLeft)}</b> חיסורים בלבד.</div>`;
    }
    h+=`</div>`;
  }else if(near.length){
    h+=`<div class="card warn"><h2>⚠️ מתקרבים ל-25%</h2>${near.map(s=>`<div class="item"><b>${esc(s.name)}</b>: חיסרת ${pct(s.pct)} מהשיעורים שהיו עד היום. עד סוף השנה מותר עוד ${s.allowedLeft} חיסורים, אז לא מפספסים בשבועות הקרובים. השיעורים מסומנים במערכת ב"חשוב להגיע".</div>`).join("")}</div>`;
  }else if(bag.some(s=>s.held>0)){
    h+=`<div class="card good"><h2>✅ כל הכבוד, אתה בשליטה</h2><p class="hint" style="margin:0">אין מקצוע שמתקרב ל-25%. ככה ממשיכים 💪</p></div>`;
  }

  // 🥧 עוגה: כל השיעורים שהיו
  const B=tl.blocks, att=B.filter(b=>!b.missed&&!b.late).length, late=B.filter(b=>!b.missed&&b.late).length, mj=B.filter(b=>b.missed&&b.justified===true).length, mu=B.filter(b=>b.missed&&b.justified!==true).length;
  h+=`<div class="card"><h2>🥧 כל השיעורים שהיו השנה</h2><div class="donutwrap">${donut([{v:att,c:"var(--green)"},{v:late,c:"var(--yellow)"},{v:mj,c:"var(--blue)"},{v:mu,c:"var(--red)"}],pct(st.attendedPct),"הגעה")}
    <div class="legend"><div><i style="background:var(--green)"></i>הגעתי: <b>${att}</b></div><div><i style="background:var(--yellow)"></i>באיחור: <b>${late}</b></div><div><i style="background:var(--blue)"></i>חיסור מוצדק: <b>${mj}</b></div><div><i style="background:var(--red)"></i>חיסור: <b>${mu}</b></div></div></div></div>`;

  // 🏅 הישגים
  const seen=load("achSeen",null), gotIds=ach.filter(a=>a.got).map(a=>a.id), fresh=seen?gotIds.filter(id=>!seen.includes(id)):[];
  h+=`<div class="card"><h2>🏅 הישגים · ${gotIds.length}/${ach.length}</h2><div class="ach">${ach.map(a=>`<div class="${a.got?"got":"lock"}" title="${esc(a.desc)}">${fresh.includes(a.id)?`<span class="new">חדש!</span>`:""}<span class="ic">${a.icon}</span>${esc(a.title)}${a.got?"":`<div class="mini"><i style="width:${Math.round(a.progress*100)}%"></i></div>`}</div>`).join("")}</div></div>`;

  // 📝 אירועים (צל"ש, הפרעה, ציוד...)
  const evs=B.flatMap(b=>b.events.map(e=>({...e,s:b.s,justifiedB:b.justified}))).reverse();
  if(evs.length){
    h+=`<div class="card"><h2>📝 מה קרה בשיעורים</h2>${evs.slice(0,25).map((e,i)=>{
      const k=e.kind==="absence"&&e.justifiedB===true?"absenceJ":e.kind, ui=Absences.EVENT_UI[k]||Absences.EVENT_UI.other;
      return `<div class="ev ${e.kind}"><span class="ei">${ui.icon}</span><div class="et"><b>${esc(ui.label||e.type)}</b> ב${esc(e.subject)}<small>${DAYN[new Date(e.date+"T12:00").getDay()]} ${fmtD(e.date)} · ${esc(e.s)}${e.lesson!=null&&e.lesson!==""?` · שעה ${esc(e.lesson)}`:""}${ui.say[0]?` · ${esc(ui.say[i%ui.say.length])}`:""}</small></div></div>`}).join("")}
      ${evs.length>25?`<p class="hint" style="margin:8px 0 0">ועוד ${evs.length-25} מוקדמים יותר</p>`:""}</div>`;
  }

  if(r.thisWeek.length)h+=`<div class="card"><h2>📅 המקצועות המסוכנים השבוע</h2>${r.thisWeek.map(w=>`<div class="item"><b style="color:${COLOR[w.status]}">●</b> <b>${esc(w.name)}</b> · ${w.when.join(" · ")}</div>`).join("")}<p class="hint" style="margin:8px 0 0">את השיעורים האלה לא מפספסים.</p></div>`;

  // 📈 ימים בשבוע
  const P=r.patterns, maxD=Math.max(1,...P.byWeekday.slice(0,5));
  if(P.total)h+=`<div class="card"><h2>📈 באיזה יום הכי הרבה חיסורים</h2><div class="days">${[0,1,2,3,4].map(i=>`<div><b style="height:${Math.round(P.byWeekday[i]/maxD*80)}px"></b>${DAYN[i]}<br><span>${P.byWeekday[i]}</span></div>`).join("")}</div></div>`;
  if(r.tips.length)h+=`<div class="card"><h2>💡 מה יעזור לך</h2>${r.tips.map(t=>`<div class="item">${t.icon} <b>${esc(t.title)}</b><br><span class="hint">${esc(t.text)}</span></div>`).join("")}</div>`;

  // מקצועות
  h+=`<div class="card" style="padding:12px 16px"><label class="tgl"><input type="checkbox" id="cj" ${countJustified?"checked":""}> לספור גם חיסורים מוצדקים ב-30%</label><p class="hint" style="margin:4px 0 0">ברירת המחדל זהירה: סופרים הכל. אם בית הספר לא סופר חיסור עם אישור, אפשר לבטל.</p></div>`;
  h+=`<h2 style="font-size:18px;margin:16px 4px 8px">המקצועות שלי</h2>`+bag.map(subjCard).join("");
  if(extra.length)h+=`<details><summary>תפילות ופעילויות (בלי בגרות)</summary>${extra.map(subjCard).join("")}</details>`;
  const um=[...r.unmatched];
  if(um.length)h+=`<div class="card"><h2>לא שויך למקצוע</h2><p class="hint">החיסורים האלה הגיעו ממשוב עם שם מקצוע שלא נמצא במערכת שלך:</p>${um.map(u=>`<div class="item">${esc(u.subject)}: ${u.absences} חיסורים</div>`).join("")}</div>`;
  h+=`<p class="foot">⚠️ זו הערכה, לא קביעה רשמית של בית הספר. החישוב לפי המערכת האישית שלך ולוח החופשות של תשפ"ז, ומה שמשוב מדווח. שיעור כפול נספר כשתי שעות. הרצף נספר עד העדכון האחרון ממשוב. הכל נשאר רק בטלפון שלך.</p>`;
  m.innerHTML=h;

  if($("exitDemo"))$("exitDemo").onclick=e=>{e.preventDefault();demo=false;history.replaceState(null,"",location.pathname);render()};
  $("cj").onchange=e=>{countJustified=e.target.checked;try{localStorage.setItem("absCountJustified",countJustified?"1":"0")}catch(_){}render()};
  if($("refresh"))$("refresh").onclick=async e=>{e.target.disabled=true;$("refMsg").textContent="מרענן…";const x=await Mashov.refresh();e.target.disabled=false;if(x.ok)render();else $("refMsg").textContent=Mashov.message(x.error)+(x.error==="need_password"?" (בפרופיל במסך הראשי)":"")};

  // הישג חדש → קונפטי. בפעם הראשונה רק שומרים, בלי לחגוג הכל בבת אחת. בדוגמה לא שומרים
  if(!demo){
    if(!seen)save("achSeen",gotIds);
    else if(fresh.length){const a=ach.find(x=>x.id===fresh[0]);celebrate(`${a.icon} הישג חדש!`,a.title+(fresh.length>1?` ועוד ${fresh.length-1}`:""));save("achSeen",gotIds)}
  }else if(!window.__demoCelebrated){window.__demoCelebrated=1;celebrate("⭐⭐ הישג חדש!","צמד צל\"שים")}
}

function subjCard(s){
  const c=COLOR[s.status];
  return `<div class="subj">${ring(s.pct,c)}<div style="flex:1"><div class="n">${esc(s.name)}</div>
    <div class="s">חיסורים: <b>${s.absences}</b>${s.justified?` (${s.justified} מוצדקים)`:""}${s.lates?` · איחורים: ${s.lates}`:""} · היו ${s.held} מתוך ${s.yearTotal} שעות${s.nonBagrut?"":` · עוד מותר: <b>${Math.max(0,s.allowedLeft)}</b>`}</div>
    <div class="c" style="color:${c}">${LABEL[s.status]} · ${esc(Absences.cheer(s))}</div></div></div>`;
}

// 🎉 קונפטי קליל, בלי ספריות
function celebrate(title,text){
  const t=document.createElement("div");t.className="toast";t.innerHTML=`<b>${esc(title)}</b>${esc(text)}`;document.body.appendChild(t);t.onclick=()=>t.remove();setTimeout(()=>t.remove(),4500);
  const cv=$("confetti"),ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#5b6cff","#a259ff","#ff6bd6","#ffd23f","#3ddc97","#5bc0ff"];
  const P=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:4+Math.random()*5,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function frame(now){ctx.clearRect(0,0,cv.width,cv.height);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()}
    if(now-t0<3200)requestAnimationFrame(frame);else ctx.clearRect(0,0,cv.width,cv.height)})(t0);
}

render();
Mashov.autoRefresh().catch(()=>{});
document.addEventListener("mashov-updated",render);
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
</script>
</body>
</html>
