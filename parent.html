<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b6cff">
<meta name="robots" content="noindex">
<title>המערכת – להורים</title>
<script src="demo-shim.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2fb;--card:#fff;--ink:#191b33;--muted:#6c7093;--line:#e3e2f2;--next:#e5e9ff;--break:#eceaf7;--accent:#5b6cff;--free:#1fb57a;--grad:linear-gradient(135deg,#5b6cff 0%,#a259ff 60%,#ff6bd6 100%)}
@media (prefers-color-scheme: dark){:root{--bg:#0f1226;--card:#1d2247;--ink:#f4f5ff;--muted:#9aa0c7;--line:#2b3162;--next:#243a8a;--break:#2a2f5c;--accent:#7c8cff;--free:#3ddc97}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,"Segoe UI",Arial,sans-serif}
.top{background:var(--grad);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;border-radius:0 0 28px 28px}
.top small{display:block;font-size:13px;opacity:.85}
.top h1{margin:4px 0 2px;font-size:25px;font-weight:900}
.top p{margin:0;font-size:14px;opacity:.9}
main{padding:14px 14px 40px;max-width:560px;margin:0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px}
.tabs button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-color-scheme: dark){.tabs button.on{color:#0b0e24}} /* טקסט כהה על הסגול הבהיר: ניגודיות מספיקה */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.card h2{margin:0 0 6px;font-size:16px;font-weight:900}
.bring{display:flex;flex-wrap:wrap;gap:6px}
.bring span{background:var(--break);border-radius:999px;padding:5px 11px;font-size:14px}
.ls{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ls:first-of-type{border-top:none}
.ls .t{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);line-height:1.4}
.ls .t b{display:block;color:var(--ink);font-size:16px}
.ls .n{font-weight:700;font-size:16px}
.ls .w{font-size:13px;color:var(--muted);margin-top:2px}
.ls.now{background:var(--next);border-radius:12px;padding:10px 8px;border-top-color:transparent}
.ls.now .n::after{content:" · עכשיו";color:var(--free);font-size:13px}
.ls.done{opacity:.5}
.ls.pray .n{font-weight:500;color:var(--muted)}
/* 🔄 שינויים מהצוות */
.chg{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;margin-inline-start:6px;background:rgba(255,107,107,.18);color:#c62828;vertical-align:1px}
.chg.s,.chg.m{background:var(--next);color:var(--ink)}
@media (prefers-color-scheme: dark){.chg{color:#ff8a8a}}
.ls.cx .n,.ls.cx .t{text-decoration:line-through;opacity:.7}
.chgn{font-size:13px;margin-top:3px}
.empty{text-align:center;color:var(--muted);padding:24px 8px;line-height:1.6}
.foot{text-align:center;font-size:12px;color:var(--muted);line-height:1.7;margin-top:16px}
.foot a{color:var(--accent);font-weight:700;text-decoration:none}
/* 💻 מחשב: קצת יותר רחב */
@media (min-width:1000px){main{max-width:720px;padding-top:24px}}
</style>
</head>
<body>
<div class="top"><small id="school"></small><h1 id="title">המערכת</h1><p id="sub"></p></div>
<main>
  <div id="updates" hidden></div>
  <div class="tabs" id="tabs"></div>
  <div id="body"></div>
  <div class="foot">👨‍👩‍👦 עמוד צפייה להורים · מתעדכן לבד<br>בלי ציונים, בלי חיסורים, ובלי שום מידע אישי מעבר לשם והכיתה.<br><a href="./">לאפליקציה המלאה ←</a></div>
</main>
<script src="data.js"></script>
<script src="updates.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
// הפרטים מגיעים בקישור (#p=...): שם, כיתה, הקבצות ומגמה. שום דבר לא נשמר בשרת
let p=null;
try{const m=location.hash.match(/p=([\w-]+)/);if(m){const s=m[1].replace(/-/g,"+").replace(/_/g,"/");p=JSON.parse(decodeURIComponent(escape(atob(s+"===".slice((s.length+3)%4)))))}}catch(e){p=null}
// קישור משובש/ערוך: רק ערכים מוכרים (הקבצה/מגמה שלא קיימת = כאילו לא נבחרה)
if(p&&typeof p==="object"){const own=(o,k)=>typeof k==="string"&&Object.prototype.hasOwnProperty.call(o,k)?k:"",t=v=>typeof v==="string"?v.slice(0,30):"";p={c:own(CLASSES_META,p.c),f:t(p.f),l:t(p.l),e:own(ENG,p.e),m:own(MATH,p.m),j:own(MAJORS,p.j)}}else p=null;
const DAYN=["ראשון","שני","שלישי","רביעי","חמישי","שישי"];
const toMin=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
const clean=t=>String(t||"").replace(/\s*\(.*\)\s*$/,"").trim();
function lessonsOf(d){
  return (d.lessons||[]).map(l=>forProfile(l,{eng:p.e,math:p.m,major:p.j})).filter(Boolean).map(l=>{
    if(l.key==="eng")return {...l,w:clean(ENG[p.e])};
    if(l.key==="math")return {...l,w:clean(MATH[p.m])};
    if(l.key==="major"){const m=MAJORS[p.j];return m?{...l,n:"מגמת "+m.n,w:m.w}:l}
    return l;
  });
}
// 🔄 שינויים מהצוות (מגיעים עם העדכונים): בוטל / מורה מחליף / שעה אחרת / הערה – כמו באפליקציה של התלמיד
const nmT=t=>String(t||"").replace(/\s*\(.*\)\s*$/,"").replace(/^מגמת /,"").trim();
function withChanges(ls,isoD){
  let ch=[];try{ch=Updates.feed().changes.filter(x=>x&&x.date===isoD&&(x.cls==="all"||x.cls===p.c))}catch(e){}
  if(!ch.length)return ls;
  return ls.map(l=>{
    const x=ch.find(x=>x.s===l.s&&nmT(x.n)===nmT(l.n)&&(!x.w||nmT(l.w)===nmT(x.w)));
    if(!x)return l;
    const o={...l,chg:x};
    if(x.kind==="sub"&&x.sub)o.w=`${x.sub} (במקום ${nmT(l.w)||"המורה"})`;
    if(x.kind==="move"&&/^\d\d:\d\d-\d\d:\d\d$/.test(x.to||"")){const[a,e]=x.to.split("-");o.s=a;o.e=e}
    return o;
  }).sort((a,b)=>toMin(a.s)-toMin(b.s));
}
const chgTag=l=>!l.chg?"":l.chg.kind==="cancel"?`<span class="chg">❌ בוטל</span>`:l.chg.kind==="move"?`<span class="chg m">⏰ הוזז (במקור ${esc(l.chg.s)})</span>`:l.chg.kind==="sub"?`<span class="chg s">🔄 מורה מחליף</span>`:"";
const gearOf=n=>String(DEFAULT_GEAR[n]||"").split(",").map(x=>x.trim()).filter(Boolean);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
// השבוע המוצג: יום ראשון של השבוע הזה, ובשישי ובשבת – של השבוע הבא (התאריכים תמיד קדימה)
const weekSun=()=>{const d=new Date();d.setHours(12,0,0,0);const w=d.getDay();d.setDate(d.getDate()-w+(w>=5?7:0));return d};
const dateOfTab=i=>{const d=weekSun();d.setDate(d.getDate()+i);return d};
let day=new Date().getDay();if(day>=5)day=0;
function draw(){
  if(!p||!CLASSES_META[p.c]){$("title").textContent="הקישור לא תקין";$("body").innerHTML=`<div class="empty">בקשו מהבן לשלוח שוב את הקישור מהאפליקציה (פרופיל ← "שליחת קישור להורים").</div>`;return}
  const meta=CLASSES_META[p.c],days=p.c==="y1"?DAYS_Y1:DAYS_Y2;
  $("school").textContent=SCHOOL_NAME||"";
  $("title").textContent=`המערכת של ${p.f||""} ${p.l||""}`.trim();
  $("sub").textContent=`כיתה ${meta.label} · מחנך: ${meta.rav}`;
  const now=new Date(),todayIso=iso(now);
  $("tabs").innerHTML=DAYN.slice(0,days.length).map((n,i)=>(days[i]&&(days[i].lessons||[]).length)?`<button data-d="${i}" class="${i===day?"on":""}">${n}${iso(dateOfTab(i))===todayIso?" · היום":""}</button>`:"").join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{day=+b.dataset.d;draw()});
  // חופשה? (לפי התאריך האמיתי של הלשונית)
  const d0=dateOfTab(day),isToday=iso(d0)===todayIso,dd=`${d0.getDate()}.${d0.getMonth()+1}`;
  const off=(SCHOOL_YEAR.off||[]).find(o=>iso(d0)>=o.from&&iso(d0)<=o.to);
  if(off){$("body").innerHTML=`<div class="card empty">🎉 ${esc(off.label)} – אין לימודים ביום ${DAYN[day]} ${dd}</div>`;return}
  const L=withChanges(lessonsOf(days[day]||{}),iso(d0)),nowM=now.getHours()*60+now.getMinutes();
  if(!L.length){$("body").innerHTML=`<div class="card empty">אין לימודים ביום הזה.</div>`;return}
  const bring=[...new Set(L.filter(l=>!(l.chg&&l.chg.kind==="cancel")).flatMap(l=>gearOf(l.n)))];
  let h=bring.length?`<div class="card"><h2>🎒 מה להביא ${isToday?"היום":"ביום "+DAYN[day]}</h2><div class="bring">${bring.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`:"";
  h+=`<div class="card"><h2>🗓️ יום ${DAYN[day]} · ${dd}</h2>${L.map(l=>{
    const s=toMin(l.s),e=toMin(l.e),cx=!!(l.chg&&l.chg.kind==="cancel"),cls=cx?"cx":isToday?(nowM>=s&&nowM<e?"now":nowM>=e?"done":""):"";
    return `<div class="ls ${cls} ${/תפילת|ערבית/.test(l.n)?"pray":""}"><div class="t"><b>${esc(l.s)}</b>${esc(l.e)}</div><div><div class="n">${esc(l.n)}${chgTag(l)}</div>${l.w?`<div class="w">${esc(l.w)}</div>`:""}${l.chg&&l.chg.note?`<div class="chgn">📌 ${esc(l.chg.note)}</div>`:""}</div></div>`}).join("")}</div>`;
  $("body").innerHTML=h;
}
draw();setInterval(draw,60e3);
// הודעות מהצוות לכיתה (לקריאה בלבד)
// (השינויים במערכת מגיעים באותו פיד, אז מציירים שוב אחרי הרענון)
if(p&&p.c&&window.Updates){Updates.render($("updates"),p.c);Updates.refresh().then(()=>{Updates.render($("updates"),p.c);draw()})}
</script>
</body>
</html>
