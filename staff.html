<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b6cff">
<meta name="robots" content="noindex">
<title>כניסת צוות · המערכת</title>
<script src="demo-shim.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1226;--card:#1d2247;--ink:#f4f5ff;--muted:#9aa0c7;--line:#2b3162;--next:#243a8a;--break:#2a2f5c;--accent:#7c8cff;--accent-ink:#0b0e24;--red:#ff5d6c;--green:#3ddc97;--grad:linear-gradient(135deg,#5b6cff 0%,#a259ff 60%,#ff6bd6 100%)}
@media (prefers-color-scheme: light){:root{--bg:#f3f2fb;--card:#fff;--ink:#191b33;--muted:#6c7093;--line:#e3e2f2;--next:#e5e9ff;--break:#eceaf7;--accent:#5b6cff;--accent-ink:#fff;--red:#e0384a;--green:#1fb57a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,"Segoe UI",Arial,sans-serif}
.top{background:var(--grad);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 18px;border-radius:0 0 28px 28px}
.top .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.top h1{margin:0;font-size:24px;font-weight:900}
.top p{margin:4px 0 0;font-size:14px;opacity:.9}
.top button{color:#fff;font:inherit;font-size:14px;font-weight:700;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);border-radius:999px;padding:8px 14px;cursor:pointer}
.tabs{display:flex;gap:6px;max-width:720px;margin:14px auto 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.tabs button.on{background:#fff;color:#2b2f6b}
main{padding:16px 14px 40px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.card h2{margin:0 0 6px;font-size:19px;font-weight:900}
.hint{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 10px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,textarea,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.btn{border:none;border-radius:12px;padding:12px 18px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:var(--break);color:var(--ink)}.btn.danger{background:var(--red);color:#fff}.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.wa{background:#25d366;color:#0b2b17}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip{font-size:13px;padding:6px 11px;font-weight:500}
.count{font-size:12px;color:var(--muted);text-align:end;margin-top:4px}
.tgl{display:flex;gap:8px;align-items:center;font-weight:700;margin-top:14px}
.tgl input{width:20px;height:20px}
.msg{border-radius:12px;padding:10px 14px;font-size:14px;margin:12px 0 0;line-height:1.5}
.msg.ok{background:rgba(61,220,151,.15);border:1.5px solid var(--green)}.msg.err{background:rgba(255,93,108,.15);border:1.5px solid var(--red)}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-of-type{border-top:none}
.item .t{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.5}
.item .m{font-size:12px;color:var(--muted);margin:4px 0 8px;line-height:1.6}
.pill{display:inline-block;border-radius:8px;padding:1px 8px;font-size:11px;font-weight:900;margin-inline-end:4px}
.pill.on{background:rgba(61,220,151,.2);color:var(--green)}.pill.off{background:var(--break);color:var(--muted)}.pill.urg{background:var(--red);color:#fff}
.code{font-family:monospace;font-size:28px;font-weight:900;letter-spacing:4px;direction:ltr;text-align:center;background:var(--bg);border-radius:12px;padding:10px;margin:8px 0}
.preview{border:1.5px dashed var(--line);border-radius:16px;padding:12px;margin-top:12px}
.preview .ph{font-size:12px;color:var(--muted);margin-bottom:6px}
/* מערכת */
.now{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.now>div{background:var(--bg);border-radius:14px;padding:12px;border:1.5px solid var(--line)}
.now b{display:block;font-size:13px;color:var(--muted)}
.now .n{font-size:17px;font-weight:900;margin-top:4px}
.now .w{font-size:13px;color:var(--muted);margin-top:2px}
.day{margin-top:14px}
.day h3{margin:0 0 6px;font-size:16px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline}
.day h3 small{font-weight:400;color:var(--muted);font-size:12px}
.ls{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--bg);margin-bottom:5px;border-inline-start:4px solid var(--accent)}
.ls.pray{border-inline-start-color:var(--line);opacity:.75}
.ls .tm{flex:0 0 92px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);direction:ltr;text-align:right}
.ls .sb{flex:1;min-width:0;font-weight:700;font-size:15px}
.ls .sb small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:1px}
.cl{display:inline-block;background:var(--break);border-radius:7px;padding:0 7px;font-size:11px;font-weight:900;margin-inline-start:4px;vertical-align:1px}
.ls.cur{background:var(--next);border-inline-start-color:var(--green)}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
.bar{position:relative;display:flex;justify-content:space-between;border-radius:10px;background:var(--bg);padding:7px 10px;margin-top:5px;overflow:hidden;font-size:14px}
.bar i{position:absolute;inset:0 0 0 auto;background:rgba(124,140,255,.28)}
.bar span,.bar b{position:relative}
.pill.sch{background:rgba(255,210,63,.25);color:var(--ink)}
[hidden]{display:none!important}
/* 💻 מחשב: רחב יותר */
@media (min-width:1000px){main{max-width:1000px;padding:24px 32px 48px}.top .bar,.tabs{max-width:1000px}}
</style>
</head>
<body>
<div class="top"><div class="bar"><div><h1>📢 כניסת צוות</h1><p id="who">עדכונים לתלמידים · המערכת</p></div><button id="logout" hidden>יציאה</button></div><div class="tabs" id="tabs" hidden></div></div>
<main id="main"><div class="card"><p class="hint">טוען…</p></div></main>

<script src="data.js"></script>
<script src="updates.js"></script>
<script src="card-editor.js"></script>
<script>
const API=((typeof SERVER_BASE!=="undefined"&&SERVER_BASE)||"")+"/api/staff";
const SITE=location.href.split("#")[0].split("?")[0];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const T={get:()=>{try{return localStorage.getItem("staffToken")}catch(e){return null}},set:v=>{try{v?localStorage.setItem("staffToken",v):localStorage.removeItem("staffToken")}catch(e){}}};
const ERR={bad_action:"התכונה הזאת עוד לא פעילה בשרת. היא תעבוד לבד אחרי שהשרת (נטליפיי) יתעדכן.",bad_time:"הזמן לא תקין.",too_many:"יותר מדי.",bad_video:"הקישור לסרטון לא תקין.",bad_phone:"מספר הטלפון לא תקין.",too_many_sets:"הגעתם למספר הסטים המקסימלי. מחקו סטים ישנים.",too_big:"הסטים תופסים יותר מדי מקום. מחקו סטים ישנים או קצרו.",code_taken:"הקוד הזה כבר בשימוש. בחר קוד אחר.",busy:"השרת עמוס לרגע. נסה שוב.",server:"תקלה בשרת. נסה שוב בעוד רגע.",bad_code:"הקוד לא נכון.",locked:"יותר מדי ניסיונות. נסה שוב בעוד 15 דקות.",auth:"צריך להיכנס מחדש.",forbidden:"אין הרשאה לפעולה הזאת.",bad_request:"חסרים פרטים או שהם לא תקינים.",bad_invite:"הקישור לא תקין.",invite_used:"הקישור הזה כבר שומש.",not_found:"לא נמצא.",network:"אין חיבור לשרת. בדוק אינטרנט ונסה שוב."};
const ROLE={admin:"מנהל",teacher:"מורה",staff:"צוות"};
let me=null,tab="write",welcome=false,caps={};

async function api(body){
  try{
    const r=await fetch(API,{method:body?"POST":"GET",headers:{"Content-Type":"application/json",...(T.get()?{Authorization:"Bearer "+T.get()}:{})},body:body?JSON.stringify(body):undefined,cache:"no-store"});
    const j=await r.json().catch(()=>({ok:false,error:"network"}));
    if(j.error==="auth"&&me){T.set(null);me=null;setTimeout(()=>showLogin("פג תוקף הכניסה. צריך להיכנס שוב."),0)}
    return j;
  }catch(e){return {ok:false,error:"network"}}
}
async function act(b,body,after,ask){
  if(ask&&!confirm(ask))return;
  b.disabled=true;const r=await api(body);
  if(!r.ok){b.disabled=false;if(r.error!=="auth")alert(ERR[r.error]||"שגיאה.");return}
  after&&after();
}
const msg=(id,text,ok)=>{const el=$(id);if(!el)return;el.className="msg "+(ok?"ok":"err");el.textContent=text;el.hidden=!text};

// ---- כניסה ----
// #invite=... : קישור אישי למנהל (פעם אחת). #code=... : קישור כניסה ישירה שהמנהל שולח למורה
const H=new URLSearchParams(location.hash.slice(1));
const INVITE=H.get("invite"),LINKCODE=H.get("code");
if(INVITE||LINKCODE)history.replaceState(null,"",location.pathname+location.search);

async function start(){
  const st=await api();
  if(!st.ok){$("main").innerHTML=`<div class="card"><h2>אין חיבור לשרת</h2><p class="hint">${esc(ERR.network)}</p><button class="btn" id="retry">נסה שוב</button></div>`;$("retry").onclick=start;return}
  // קישור המנהל: הקוד שבקישור הוא קוד הכניסה שלו
  if(INVITE){
    const r=await api({action:"login",code:INVITE});
    if(r.ok){T.set(r.token);me=r.user;caps=r.caps||{};welcome=!!r.first;return showHome()}
    if(r.error==="locked")return showLogin(ERR.locked);
    if(!T.get())return showLogin("הקוד שבקישור כבר לא בתוקף (אולי שינית אותו). נכנסים עם הקוד שלך.");
  }
  if(st.needsSetup)return showWaiting();
  if(LINKCODE){const r=await api({action:"login",code:LINKCODE});if(r.ok){T.set(r.token);me=r.user;caps=r.caps||{};return showHome()}}
  if(T.get()){const r=await api({action:"me"});if(r.ok){me=r.user;caps=r.caps||{};return showHome()}}
  showLogin();
}
function showWaiting(){
  $("main").innerHTML=`<div class="card"><h2>🔒 עוד לא הוגדר מנהל</h2><p class="hint">המנהל נכנס בפעם הראשונה עם הקוד האישי שנשלח אליו (או בלחיצה על הקישור שבהודעה). אחרי זה הוא מוסיף את המורים ושולח לכל אחד קוד.</p>
    <input id="lCode" dir="ltr" autocomplete="off" placeholder="הקוד מההודעה" style="text-align:center;font-size:20px;letter-spacing:2px">
    <div class="row" style="margin-top:14px"><button class="btn" id="lGo" style="flex:1">כניסה</button></div><div id="lMsg" hidden></div></div>`;
  wireLogin();
}
function showLogin(note){
  $("logout").hidden=true;$("tabs").hidden=true;$("who").textContent="עדכונים לתלמידים · המערכת";
  $("main").innerHTML=`<div class="card"><h2>כניסה</h2><p class="hint">${esc(note||"מנהל או מורה: מקלידים את הקוד האישי שקיבלתם בהודעה.")}</p>
    <input id="lCode" type="password" dir="ltr" autocomplete="current-password" placeholder="קוד כניסה" style="text-align:center;font-size:20px;letter-spacing:3px">
    <div class="row" style="margin-top:14px"><button class="btn" id="lGo" style="flex:1">כניסה</button></div><div id="lMsg" hidden></div>
    <p class="hint" style="margin-top:14px">מורה בלי קוד? המנהל יוצר לך קוד מהמסך שלו ושולח בוואטסאפ.</p></div>`;
  wireLogin();
}
function wireLogin(){
  const go=async()=>{const code=$("lCode").value.trim();if(!code)return;$("lGo").disabled=true;const r=await api({action:"login",code});$("lGo").disabled=false;
    if(!r.ok)return msg("lMsg",ERR[r.error]||"שגיאה.");T.set(r.token);me=r.user;caps=r.caps||{};welcome=!!r.first;showHome()};
  $("lGo").onclick=go;$("lCode").onkeydown=e=>{if(e.key==="Enter")go()};
}

// ---- המסך הראשי לצוות: לשוניות ----
function showHome(){
  $("logout").hidden=false;$("who").textContent=`${me.name} · ${ROLE[me.role]||"מורה"}`;
  const TABS=[["write","✍️ עדכון חדש"],["list","📋 עדכונים"],["qs","❓ שאלות"],["polls","📊 סקרים"],["events","📅 אירועים"],["rel","🏃 שחרורים"],["sets","🃏 כרטיסיות"],["tt","🗓️ מערכת"],...(me.role==="admin"?[["team","👥 צוות"],["fb","📬 פניות"],["stats","📈 נתונים"]]:[]),["me","⚙️ החשבון שלי"]];
  if(!TABS.some(t=>t[0]===tab))tab="write";
  $("tabs").hidden=false;$("tabs").innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===tab?"on":""}">${l}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;showHome()});
  ({write:showWrite,list:showList,tt:showTT,team:showTeam,me:showMe,fb:showFeedback,sets:showSets,qs:showQuestions,polls:showPolls,events:showEvents,rel:showReleases,stats:showStats})[tab]();
  if(welcome&&tab==="write"){
    const w=document.createElement("div");w.className="card";w.style.borderColor="var(--green)";
    w.innerHTML=`<h2>👋 ברוך הבא, נכנסת כמנהל ראשי</h2><p class="hint" style="margin:0">מכאן כותבים עדכונים לתלמידים, רואים את המערכת של כל כיתה ומורה, ומוסיפים מורים (לשונית 👥 צוות). רוצה קוד כניסה משלך? לשונית <b>⚙️ החשבון שלי</b>.</p><div class="row" style="margin-top:12px"><button class="btn" id="wMe">לבחור קוד משלי</button><button class="btn ghost" id="wX">אחר כך</button></div>`;
    $("main").prepend(w);$("wMe").onclick=()=>{welcome=false;tab="me";showHome()};$("wX").onclick=()=>{welcome=false;w.remove()};
  }
}

// ---- כתיבת עדכון ----
const DUR=[["15 דק'",15],["שעה",60],["3 שעות",180],["עד סוף היום","eod"],["יום",1440],["3 ימים",4320],["שבוע",10080]];
const TPL=[["🔄 שינוי במערכת","שינוי במערכת: "],["❌ שיעור מבוטל","השיעור ב… היום מבוטל. "],["📝 מבחן","תזכורת: מבחן ב… ביום … . החומר: "],["🎒 להביא מחר","מחר להביא: "],["⏰ שינוי בשעות","מחר הלימודים מתחילים ב-… "],["🎉 כל הכבוד","כל הכבוד ל"]];
let dur=60,aud="all",urgent=false,users=null;
function minutesFor(v,from){if(v!=="eod")return v;const n=from?new Date(from):new Date(),e=new Date(n);e.setHours(23,59,0,0);return Math.max(1,Math.round((e-n)/60000))}
async function showWrite(){
  const admin=me.role==="admin";
  $("main").innerHTML=`<div class="card"><h2>✍️ עדכון חדש לתלמידים</h2><p class="hint">קופץ על המסך אצל כל תלמיד שפותח את האפליקציה, ואז נשאר בראש המסך עד שהזמן נגמר.</p>
    <div class="row" style="margin-bottom:8px">${TPL.map(([l],i)=>`<button class="chip" data-tpl="${i}">${l}</button>`).join("")}</div>
    <textarea id="text" maxlength="600" placeholder="מה רוצים להגיד לתלמידים? קישורים שתדביקו כאן יהיו לחיצים."></textarea><div class="count" id="count">0/600</div>
    <label>🎬 סרטון <small style="font-weight:400;color:var(--muted)">(לא חובה)</small></label>
    <input id="video" dir="ltr" inputmode="url" autocomplete="off" placeholder="https://youtu.be/...">
    <div class="hint" id="videoHint" style="margin:6px 0 0;font-size:13px">מעלים את הסרטון ליוטיוב (כ"לא רשום") או לגוגל דרייב (שיתוף: "כל מי שיש לו את הקישור"), ומדביקים כאן את הקישור. התלמידים יראו כפתור ▶️ ויצפו רק אם ירצו.</div>
    ${admin?`<label>בשם מי</label><select id="as"><option value="">אני (${esc(me.name)})</option></select><input id="asName" maxlength="40" placeholder="השם שיופיע, למשל: המזכירות" hidden style="margin-top:8px">`:""}
    <label>למי</label><div class="seg" id="aud"><button data-v="all" class="on">כל התלמידים</button><button data-v="y1">י'1</button><button data-v="y2">י'2</button></div>
    <label>לכמה זמן</label><div class="seg" id="dur">${DUR.map(([l,v])=>`<button data-v="${v}" class="${v===60?"on":""}">${l}</button>`).join("")}<button data-v="custom">אחר…</button></div>
    <div class="row" id="custom" hidden style="margin-top:8px"><input id="cNum" type="number" min="1" max="999" value="30" style="width:100px;flex:0 0 auto"><select id="cUnit" style="width:auto;flex:0 0 auto"><option value="1">דקות</option><option value="60">שעות</option><option value="1440">ימים</option></select></div>
    <label>מתי לשלוח</label><div class="seg" id="when"><button data-v="now" class="on">עכשיו</button><button data-v="later">⏰ בזמן אחר…</button></div>
    <input type="datetime-local" id="whenAt" hidden style="margin-top:8px">
    <label class="tgl"><input type="checkbox" id="urg"> דחוף (באדום, מופיע ראשון)</label>
    <div class="preview"><div class="ph">כך זה ייראה אצל התלמידים:</div><div id="prev"></div></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="post" style="flex:1">פרסם עדכון</button></div><div id="pMsg" hidden></div></div>`;
  dur=60;aud="all";urgent=false;
  const seg=(id,cb)=>$(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{$(id).querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));cb(b.dataset.v)});
  seg("aud",v=>{aud=v;preview()});
  seg("dur",v=>{$("custom").hidden=v!=="custom";dur=v==="custom"?"custom":(v==="eod"?"eod":Number(v));preview()});
  $("main").querySelectorAll("[data-tpl]").forEach(b=>b.onclick=()=>{const t=$("text");t.value=TPL[b.dataset.tpl][1]+t.value;t.focus();t.setSelectionRange(t.value.length,t.value.length);t.oninput()});
  $("text").oninput=()=>{$("count").textContent=$("text").value.length+"/600";preview()};
  $("video").oninput=()=>{showVideoHint();preview()};
  $("urg").onchange=e=>{urgent=e.target.checked;preview()};

// ---- מערכת: לפי כיתה או לפי מורה ----
const CLS={y1:DAYS_Y1,y2:DAYS_Y2};
const DAYN=["ראשון","שני","שלישי","רביעי","חמישי","שישי"];
const nameOf=t=>String(t||"").replace(/\s*\(.*\)\s*$/,"").trim();
const groupOf=t=>(String(t||"").match(/\((.*)\)/)||[])[1]||"";
// כל השיעורים כ"משבצות": שיעורי הקבצה ומגמה נפרשים לכל המורים שמלמדים במקביל
function slots(){
  const out=[];
  for(const [c,days] of Object.entries(CLS))days.forEach((d,di)=>(d.lessons||[]).forEach(l=>{
    if(l.key==="eng")Object.values(ENG).forEach(t=>out.push({c,d:di,s:l.s,e:l.e,n:"אנגלית",w:nameOf(t),g:groupOf(t),group:true}));
    else if(l.key==="math")Object.values(MATH).forEach(t=>out.push({c,d:di,s:l.s,e:l.e,n:"מתמטיקה",w:nameOf(t),g:groupOf(t)||"הקבצה",group:true}));
    else if(l.key==="major")Object.values(MAJORS).forEach(m=>out.push({c,d:di,s:l.s,e:l.e,n:"מגמת "+m.n,w:m.w,group:true}));
    else out.push({c,d:di,s:l.s,e:l.e,n:l.n,w:l.w});
  }));
  return out;
}
const SL=slots();
const TEACHERS=[...new Set(SL.map(x=>x.w).filter(Boolean))].sort((a,b)=>a.replace(/^הרב /,"").localeCompare(b.replace(/^הרב /,""),"he"));
const PRAY=/תפילת|ערבית/;
let ttMode="cls",ttCls="y1",ttT=TEACHERS[0];
const hmNow=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
function nowCard(){
  const d=new Date().getDay(),hm=hmNow();
  return `<div class="now">${Object.keys(CLS).map(c=>{
    const today=SL.filter(x=>x.c===c&&x.d===d);
    const cur=today.filter(x=>x.s<=hm&&hm<x.e),next=today.filter(x=>x.s>hm).sort((a,b)=>a.s<b.s?-1:1)[0];
    const lbl=CLASSES_META[c].label;
    if(cur.length){const g=cur[0].group;return `<div><b>עכשיו ב${lbl}</b><div class="n">${esc(g?cur[0].n+" (הקבצות)":cur[0].n)}</div><div class="w">${esc(g?cur.map(x=>x.w).filter(Boolean).join(", "):cur[0].w)} · עד ${cur[0].e}</div></div>`}
    if(next)return `<div><b>${lbl} · אין שיעור כרגע</b><div class="n">הבא: ${esc(next.group?next.n+" (הקבצות)":next.n)}</div><div class="w">ב-${next.s}</div></div>`;
    return `<div><b>${lbl}</b><div class="n">אין עוד שיעורים היום</div></div>`;
  }).join("")}</div>`;
}
function showTT(){
  $("main").innerHTML=`<div class="card"><h2>🗓️ מה קורה עכשיו</h2>${nowCard()}</div>
  <div class="card"><h2>המערכת</h2>
    <div class="seg" id="ttMode"><button data-v="cls" class="${ttMode==="cls"?"on":""}">לפי כיתה</button><button data-v="t" class="${ttMode==="t"?"on":""}">לפי מורה</button></div>
    <div id="ttPick" style="margin-top:10px"></div><div id="ttBody"></div></div>`;
  $("ttMode").querySelectorAll("button").forEach(b=>b.onclick=()=>{ttMode=b.dataset.v;showTT()});
  if(ttMode==="cls"){
    $("ttPick").innerHTML=`<div class="seg" id="ttC">${[...Object.keys(CLS).map(c=>[c,CLASSES_META[c].label]),["both","שתי הכיתות"]].map(([v,l])=>`<button data-v="${v}" class="${v===ttCls?"on":""}">${l}</button>`).join("")}</div>`;
    $("ttC").querySelectorAll("button").forEach(b=>b.onclick=()=>{ttCls=b.dataset.v;showTT()});
  }else{
    $("ttPick").innerHTML=`<select id="ttT">${TEACHERS.map(t=>`<option ${t===ttT?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
    $("ttT").onchange=e=>{ttT=e.target.value;drawTT()};
  }
  drawTT();
}
function drawTT(){
  const today=new Date().getDay(),hm=hmNow();
  let list;
  if(ttMode==="t"){
    // השיעורים של המורה בשתי הכיתות. אותו שיעור באותה שעה לשתי הכיתות = שורה אחת
    const m={};SL.filter(x=>x.w===ttT).forEach(x=>{const k=`${x.d}|${x.s}|${x.n}`;(m[k]=m[k]||{...x,cs:[]}).cs.push(x.c)});
    list=Object.values(m);
  }else{
    const cs=ttCls==="both"?Object.keys(CLS):[ttCls],m={};
    SL.filter(x=>cs.includes(x.c)).forEach(x=>{const k=`${x.d}|${x.s}|${x.group?x.n:x.n+x.w}|${ttCls==="both"?"":x.c}`;const o=m[k]=m[k]||{...x,cs:[],ws:[]};if(!o.cs.includes(x.c))o.cs.push(x.c);if(x.w&&!o.ws.includes(x.w))o.ws.push(x.w)});
    list=Object.values(m);
  }
  const total=list.filter(x=>!PRAY.test(x.n)).length;
  let h=ttMode==="t"?`<p class="hint" style="margin-top:12px"><b>${esc(ttT)}</b> · ${total} שיעורים בשבוע</p>`:"";
  for(let d=0;d<6;d++){
    const ls=list.filter(x=>x.d===d).sort((a,b)=>a.s<b.s?-1:a.s>b.s?1:0);
    if(!ls.length&&d===5)continue;
    h+=`<div class="day"><h3>${DAYN[d]}${d===today?" <small>· היום</small>":""}</h3>`;
    if(!ls.length)h+=`<div class="empty">אין שיעורים</div>`;
    for(const x of ls){
      const cur=d===today&&x.s<=hm&&hm<x.e;
      const cls=(ttMode==="t"||ttCls==="both")?x.cs.map(c=>`<span class="cl">${CLASSES_META[c].label}</span>`).join(""):"";
      const who=ttMode==="t"?(x.g?`הקבצה: ${esc(x.g)}`:""):(x.group?esc((x.ws||[]).join(" · ")):esc((x.ws||[])[0]||""));
      h+=`<div class="ls ${PRAY.test(x.n)?"pray":""} ${cur?"cur":""}"><div class="tm">${x.s}–${x.e}</div><div class="sb">${esc(x.n)}${x.group&&ttMode==="cls"&&/אנגלית|מתמטיקה/.test(x.n)?" (הקבצות)":""}${cls}${who?`<small>${who}</small>`:""}</div></div>`;
    }
    h+=`</div>`;
  }
  $("ttBody").innerHTML=h;
}

  if(!r.ok){box.innerHTML=`<p class="hint">${esc(ERR[r.error]||"שגיאה.")}</p>`;return}
  const list=r.feedback.filter(f=>fbFilter==="all"||!f.done);
  if(!list.length){box.innerHTML=`<p class="hint">${fbFilter==="open"?"אין פניות פתוחות 🎉":"עוד לא התקבלו פניות."}</p>`;return}
  box.innerHTML=list.map(f=>{const [ic,lb]=FBK[f.kind]||FBK.other;return `<div class="item" style="${f.done?"opacity:.55":""}"><div class="m"><span class="pill ${f.kind==="bug"?"urg":"on"}">${ic} ${lb}</span>${f.done?'<span class="pill off">טופל</span>':""}${f.name?esc(f.name):"ללא שם"}${f.cls?" · "+esc(f.cls):""} · ${fmtT(f.at)}${f.page?" · מסך: "+esc(f.page):""}</div><div class="t">${esc(f.text)}</div>${f.device?`<details style="margin-top:6px"><summary class="hint" style="margin:0;cursor:pointer">פרטים טכניים</summary><div class="hint" style="direction:ltr;text-align:left;font-size:12px;overflow-wrap:anywhere">${esc(f.device)} ${esc(f.ver||"")}</div></details>`:""}
    <div class="row" style="margin-top:8px"><button class="btn sm ghost" data-done="${esc(f.id)}">${f.done?"החזר לפתוחות":"✓ טופל"}</button><button class="btn sm danger" data-fdel="${esc(f.id)}">מחק</button></div></div>`}).join("");
  box.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>act(b,{action:"feedbackDone",id:b.dataset.done},showFeedback));
  box.querySelectorAll("[data-fdel]").forEach(b=>b.onclick=()=>act(b,{action:"feedbackDelete",id:b.dataset.fdel},showFeedback,"למחוק את הפנייה?"));
}

// ---- צוות (מנהל בלבד) ----
async function showTeam(){
  $("main").innerHTML=`<div class="card"><h2>👥 הוספת מורה</h2><p class="hint">כל מורה מקבל קוד אישי וקישור כניסה. שולחים לו בוואטסאפ, והוא נכנס בלחיצה אחת. מורה יכול לכתוב עדכונים ולנהל את שלו.</p>
    <input id="uName" maxlength="40" placeholder="שם המורה, כמו שיופיע לתלמידים">
    <label>תפקיד</label><div class="seg" id="uRole"><button data-v="teacher" class="on">מורה</button><button data-v="admin">מנהל נוסף (סגן, רכז)</button></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="uAdd" style="flex:1">צור קוד</button></div>
    <div id="uMsg" hidden></div>
    ${TEACHERS.length?`<p class="hint" style="margin-top:14px">בחירה מהירה מהמערכת:</p><div class="row">${TEACHERS.map(t=>`<button class="chip" data-n="${esc(t)}">${esc(t)}</button>`).join("")}</div>`:""}</div>
    <div class="card"><h2>הצוות</h2><div id="users"><p class="hint">טוען…</p></div></div>`;
  let role="teacher";
  $("uRole").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("uRole").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));role=b.dataset.v});
  $("main").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{$("uName").value=b.dataset.n;$("uName").scrollIntoView({block:"center",behavior:"smooth"})});
  $("uAdd").onclick=async()=>{
    const name=$("uName").value.trim();if(!name)return msg("uMsg","כתוב את שם המורה.");
    $("uAdd").disabled=true;const r=await api({action:"addUser",name,role});$("uAdd").disabled=false;
    if(!r.ok)return msg("uMsg",ERR[r.error]||"שגיאה.");$("uName").value="";showCode(r.user,r.code);loadUsers();
  };
  loadUsers();
}
async function loadUsers(){
  const r=await api({action:"users"});const box=$("users");if(!box)return;
  if(!r.ok){box.innerHTML=`<p class="hint">${esc(ERR[r.error]||"שגיאה.")}</p>`;return}
  box.innerHTML=r.users.map(u=>`<div class="item row" style="justify-content:space-between"><span><b>${esc(u.name)}</b> <span class="pill off">${u.owner?"מנהל ראשי":ROLE[u.role]}</span></span>${u.id===me.id?`<span class="hint" style="margin:0">זה אתה</span>`:u.owner?"":`<span class="row"><button class="btn sm ghost" data-reset="${esc(u.id)}">קוד חדש</button><button class="btn sm danger" data-rm="${esc(u.id)}">הסר</button></span>`}</div>`).join("");
  box.querySelectorAll("[data-reset]").forEach(b=>b.onclick=async()=>{if(!confirm("ליצור קוד חדש? הקוד הישן יפסיק לעבוד."))return;const x=await api({action:"resetUser",id:b.dataset.reset});if(x.ok){showCode(x.user,x.code);$("uMsg").scrollIntoView({block:"center",behavior:"smooth"})}else alert(ERR[x.error]||"שגיאה.")});
  box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{if(!confirm("להסיר? הוא לא יוכל להיכנס יותר."))return;const x=await api({action:"removeUser",id:b.dataset.rm});if(!x.ok)alert(ERR[x.error]||"שגיאה.");loadUsers()});
}
function showCode(u,code){
  const link=`${SITE}#code=${code}`;
  const text=`שלום ${u.name}, הוספתי אותך לכתיבת עדכונים לתלמידים באפליקציית המערכת.\nכניסה בלחיצה: ${link}\nהקוד שלך (אם תצטרך): ${code}`;
  const box=$("uMsg");box.className="msg ok";box.hidden=false;
  box.innerHTML=`הקוד של <b>${esc(u.name)}</b> (מוצג רק עכשיו):<div class="code">${esc(code)}</div><div class="row"><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">📤 שלח בוואטסאפ</a><button class="btn ghost" id="cpy">העתק הודעה</button></div>`;
  $("cpy").onclick=async()=>{try{await navigator.clipboard.writeText(text);$("cpy").textContent="הועתק ✓"}catch(e){}};
}
$("logout").onclick=()=>{T.set(null);me=null;tab="write";showLogin()};
start();
</script>
