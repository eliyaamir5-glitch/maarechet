# אתר סטטי + פונקציות. בזמן הפריסה: קובצי היומן נוצרים מ-data.js, והאתר מועתק ל-_site (scripts/build.js)
[build]
  publish = "_site"
  command = "node scripts/build.js"

[build.environment]
  NODE_VERSION = "22"

# פונקציות שרת (חיבור למשוב). הכתובת /api/mashov מוגדרת בתוך הפונקציה עצמה
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/mashov.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# קובצי יומן: סוג תוכן נכון ל-webcal, וקאש קצר כדי ששינויים יגיעו לטלפונים מהר
[[headers]]
  for = "/cal/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
