# אתר סטטי. בזמן הפריסה נוצרים מחדש 36 קובצי היומן מ-data.js
[build]
  publish = "."
  command = "node gen-cal.js"

[build.environment]
  NODE_VERSION = "20"

# קובצי יומן: סוג תוכן נכון ל-webcal, וקאש קצר כדי ששינויים יגיעו לטלפונים מהר
[[headers]]
  for = "/cal/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
